# Owner-only local Windows build of OnTrack Voice 0.3.11.
# No Android signing keystore is committed, cached, or uploaded.
# Builds from the exact triggering revision, using the pinned upstream commit.
name: Build OnTrack Voice 0.3.11 on owner's Windows 11
run-name: Local Windows signed APK 0.3.11
on:
  push:
    branches:
      - feat/voice-production-gap-20261103
    paths:
      - .github/workflows/owner-windows-apk-0311.yml
      - tools/build_shellserver_windows.ps1
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
concurrency:
  group: owner-windows-apk-0311
  cancel-in-progress: false
jobs:
  build:
    if: github.actor == 'ahmedbedir'
    runs-on: [self-hosted, Windows, X64, ontrack-signing-recovery]
    timeout-minutes: 110
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout exact OnTrack Voice revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout pinned Android upstream
        uses: actions/checkout@v4
        with:
          repository: jemcik/JemRec
          ref: f011062adfb3a2154c4d5a9cc4394032fb4345f2
          path: .build/jemrec
          persist-credentials: false
      - name: Check Windows JDK 21, Android SDK and exact signing certificate
        run: |
          $ErrorActionPreference = 'Stop'
          $sdk = Join-Path $env:LOCALAPPDATA 'Android\Sdk'
          $androidJar = Join-Path $sdk 'platforms\android-36\android.jar'
          $signer = Join-Path $sdk 'build-tools\36.0.0\apksigner.bat'
          $analyzer = Join-Path $sdk 'cmdline-tools\latest\bin\apkanalyzer.bat'
          $key = Join-Path $env:USERPROFILE '.android\debug.keystore'
          foreach ($required in @($androidJar, $signer, $analyzer, $key)) {
            if (-not (Test-Path -LiteralPath $required)) {
              throw ('Missing local build prerequisite: ' + $required)
            }
          }
          $javaVersion = (& java -version 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0 -or $javaVersion -notmatch '(?m)(?:version "21[.\"]|openjdk 21(?:[.\s]|$))') {
            throw ('JDK 21 is required, detected: ' + $javaVersion)
          }
          & python --version
          if ($LASTEXITCODE -ne 0) { throw 'Python unavailable on local runner.' }
          $env:ANDROID_HOME = $sdk
          $env:ANDROID_SDK_ROOT = $sdk
          "ANDROID_HOME=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "ANDROID_SDK_ROOT=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $cert = Join-Path $env:RUNNER_TEMP 'ontrack-windows-build-signing-cert.der'
          try {
            & keytool -exportcert -alias androiddebugkey -keystore $key -storepass android -file $cert | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'Cannot export certificate for verification.' }
            $actual = (Get-FileHash -LiteralPath $cert -Algorithm SHA256).Hash.ToLowerInvariant()
            $expected = 'd25378b9c6d8486749fa64cf1f85a8a2d0b24a599588611392135f54c720ba3f'
            if ($actual -ne $expected) { throw 'Original signing identity mismatch. Refusing build.' }
          } finally {
            Remove-Item -LiteralPath $cert -Force -ErrorAction SilentlyContinue
          }
          Write-Host 'ORIGINAL_SIGNING_CERTIFICATE: PASS'
          Write-Host 'LOCAL_BUILD_PREREQUISITES: PASS'
      - name: Confirm pinned source and apply OnTrack Android overlay
        run: |
          $ErrorActionPreference = 'Stop'
          & python saas/mobile/audio-proof/prepare.py .build/jemrec
          if ($LASTEXITCODE -ne 0) { throw 'OnTrack Android overlay failed.' }
          $prepared = '.build/jemrec/ontrack-build-source.json'
          if (-not (Test-Path -LiteralPath $prepared)) { throw 'No source provenance produced.' }
          Write-Host 'ONTRACK_SOURCE_OVERLAY: PASS'
      - name: Compile Android shell-side daemon with native Windows Java and D8
        run: |
          $ErrorActionPreference = 'Stop'
          $sdk = Join-Path $env:LOCALAPPDATA 'Android\Sdk'
          & .\tools\build_shellserver_windows.ps1 -ShellServerDir '.build\jemrec\shellserver' -AndroidSdk $sdk
          if (-not $?) { throw 'Windows shellserver compilation failed.' }
      - name: Run Android unit and daemon tests
        working-directory: .build/jemrec
        run: |
          $ErrorActionPreference = 'Stop'
          & .\gradlew.bat --no-daemon :app:testDebugUnitTest :daemon-tests:test
          if ($LASTEXITCODE -ne 0) { throw 'Android tests failed; no APK may be published.' }
          Write-Host 'ANDROID_UNIT_TESTS: PASS'
      - name: Compile Android debug APK
        working-directory: .build/jemrec
        run: |
          $ErrorActionPreference = 'Stop'
          & .\gradlew.bat --no-daemon :app:assembleDebug
          if ($LASTEXITCODE -ne 0) { throw 'Android APK compilation failed.' }
          if (-not (Test-Path -LiteralPath 'app\build\outputs\apk\debug\app-debug.apk')) {
            throw 'Android build did not produce expected APK.'
          }
          Write-Host 'ANDROID_APK_ASSEMBLED: PASS'
      - name: Sign APK with original identity and verify final manifest
        run: |
          $ErrorActionPreference = 'Stop'
          $sdk = Join-Path $env:LOCALAPPDATA 'Android\Sdk'
          $signer = Join-Path $sdk 'build-tools\36.0.0\apksigner.bat'
          $analyzer = Join-Path $sdk 'cmdline-tools\latest\bin\apkanalyzer.bat'
          $key = Join-Path $env:USERPROFILE '.android\debug.keystore'
          $output = 'D:\ai\OnTrack-Voice-Builds\0.3.11'
          New-Item -Path $output -ItemType Directory -Force | Out-Null
          $unsigned = Join-Path $env:GITHUB_WORKSPACE '.build\jemrec\app\build\outputs\apk\debug\app-debug.apk'
          $signed = Join-Path $output 'OnTrack-Voice-0.3.11.apk'
          if (Test-Path -LiteralPath $signed) {
            throw 'Signed APK already exists at destination: refusing to overwrite existing release.'
          }
          & $signer sign --ks $key --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android --out $signed $unsigned
          if ($LASTEXITCODE -ne 0) { throw 'Signing failed.' }
          $signature = & $signer verify --print-certs $signed
          if ($LASTEXITCODE -ne 0) { throw 'Signature verification failed.' }
          $expected = 'd25378b9c6d8486749fa64cf1f85a8a2d0b24a599588611392135f54c720ba3f'
          if (($signature | Out-String).ToLowerInvariant() -notlike "*$expected*") {
            throw 'Final APK signing certificate does not match installed app.'
          }
          & $signer verify --verbose $signed
          if ($LASTEXITCODE -ne 0) { throw 'APK verification failed.' }
          $manifest = Join-Path $env:RUNNER_TEMP 'ontrack-final-android-manifest.xml'
          & $analyzer manifest print $signed | Out-File -LiteralPath $manifest -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw 'Failed to read final APK manifest.' }
          & python tools/check_mobile_manifest.py $manifest
          if ($LASTEXITCODE -ne 0) { throw 'Final APK manifest safety contract failed.' }
          $hash = (Get-FileHash -LiteralPath $signed -Algorithm SHA256).Hash.ToLowerInvariant()
          "SHA256 $hash  OnTrack-Voice-0.3.11.apk" | Out-File -LiteralPath (Join-Path $output 'SHA256SUMS.txt') -Encoding ascii
          Copy-Item -LiteralPath '.build\jemrec\ontrack-build-source.json' -Destination (Join-Path $output 'ontrack-build-source.json')
          Write-Host ('APK_LOCAL_PATH: ' + $signed)
          Write-Host ('APK_SHA256: ' + $hash)
          Write-Host 'SIGNED_APK_VERIFIED: PASS'
      - name: Publish only the verified APK and public build metadata
        uses: actions/upload-artifact@v4
        with:
          name: OnTrack-Voice-0.3.11-Windows-signed
          path: |
            D:\ai\OnTrack-Voice-Builds\0.3.11\OnTrack-Voice-0.3.11.apk
            D:\ai\OnTrack-Voice-Builds\0.3.11\SHA256SUMS.txt
            D:\ai\OnTrack-Voice-Builds\0.3.11\ontrack-build-source.json
          if-no-files-found: error
          retention-days: 14
