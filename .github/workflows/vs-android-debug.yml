name: VS - Android standalone debug APK

on:
  push:
    branches: [main]
    paths:
      - 'VS/**'
      - '.github/workflows/vs-android-debug.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vs-debug:
    name: Build VS APK independently
    runs-on: [self-hosted, Windows]
    timeout-minutes: 30
    defaults:
      run:
        shell: powershell
        working-directory: VS
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Reuse installed Android SDK (skip broken setup-android action)
        shell: powershell
        run: |
          $paths = @(
            $env:ANDROID_HOME,
            $env:ANDROID_SDK_ROOT,
            (Join-Path $env:LOCALAPPDATA 'Android\Sdk'),
            (Join-Path $env:USERPROFILE '.android\sdk'),
            'C:\Android\Sdk',
            'D:\Android\Sdk',
            'D:\ai\android-sdk',
            'D:\Android',
            'C:\Users\ahmed\AppData\Local\Android\Sdk'
          ) | Where-Object { $_ -and (Test-Path $_) }
          $sdk = $paths | Where-Object {
            (Test-Path (Join-Path $_ 'platforms')) -and
            (Test-Path (Join-Path $_ 'build-tools'))
          } | Select-Object -First 1
          if (-not $sdk) {
            Write-Host "SDK candidates: $($paths -join '; ')"
            throw 'Android SDK platforms and build-tools not found on Windows runner'
          }
          Write-Host "Using SDK: $sdk"
          "ANDROID_HOME=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii
          "ANDROID_SDK_ROOT=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii
          Get-ChildItem (Join-Path $sdk 'platforms') | Select-Object -ExpandProperty Name
          Get-ChildItem (Join-Path $sdk 'build-tools') | Select-Object -ExpandProperty Name
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile independent VS ADB shell bridge (no JemRec)
        run: |
          $ErrorActionPreference = 'Stop'
          $sdk = $env:ANDROID_HOME
          $androidJar = Join-Path $sdk 'platforms/android-35/android.jar'
          if (!(Test-Path $androidJar)) {
            $androidJar = (Get-ChildItem (Join-Path $sdk 'platforms') -Directory |
              Sort-Object Name -Descending |
              ForEach-Object { Join-Path $_.FullName 'android.jar' } |
              Where-Object { Test-Path $_ } |
              Select-Object -First 1)
          }
          if (-not $androidJar) { throw 'Missing Android android.jar' }
          $classDir = 'shellbridge/build/classes'
          $dexDir = 'shellbridge/build/dex'
          $assets = 'app/src/main/assets'
          New-Item -ItemType Directory -Force -Path $classDir,$dexDir,$assets | Out-Null
          javac -source 8 -target 8 -cp $androidJar -d $classDir 'shellbridge/src/com/ontrack/vs/shell/VsTelephonyShell.java'
          if ($LASTEXITCODE -ne 0) { throw 'VS shell bridge javac failed' }
          $d8 = Get-ChildItem (Join-Path $sdk 'build-tools') -Directory |
            Sort-Object Name -Descending |
            ForEach-Object { Join-Path $_.FullName 'd8.bat' } |
            Where-Object { Test-Path $_ } |
            Select-Object -First 1
          if (-not $d8) { throw 'Missing Android d8' }
          & $d8 --min-api 26 --lib $androidJar --output $dexDir "$classDir/com/ontrack/vs/shell/VsTelephonyShell.class"
          if ($LASTEXITCODE -ne 0) { throw 'VS shell bridge dex failed' }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $jar = Join-Path $assets 'vs-bridge.jar'
          if (Test-Path $jar) { Remove-Item $jar -Force }
          [System.IO.Compression.ZipFile]::CreateFromDirectory((Resolve-Path $dexDir).Path, (Join-Path (Get-Location) $jar))
          if (!(Test-Path $jar)) { throw 'VS shell bridge asset missing' }
          Write-Host 'VS shell bridge included in APK assets (compiled solely from VS/shellbridge)'
      - name: Build VS only (not the OnTrack agent)
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Validate output
        run: |
          $apk = 'app/build/outputs/apk/debug/app-debug.apk'
          if (!(Test-Path $apk)) { throw 'VS APK was not built' }
          Get-FileHash $apk -Algorithm SHA256 | Format-List
      - name: Publish VS APK as GitHub prerelease (Actions artifacts quota exhausted)
        shell: powershell
        env:
          GH_VS_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $file = (Resolve-Path 'app/build/outputs/apk/debug/app-debug.apk').Path
          $tag = "vs-debug-$env:GITHUB_RUN_ID"
          $headers = @{
            Authorization = "Bearer $env:GH_VS_TOKEN"
            Accept = 'application/vnd.github+json'
            'User-Agent' = 'VS-APK-Builder'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $body = @{
            tag_name = $tag
            target_commitish = $env:GITHUB_SHA
            name = "VS Drama3 test APK - $env:GITHUB_RUN_ID"
            body = 'VS standalone Android debug test: Fish ASR, Drama3 TTS, 3 persona presets, overlay, permission checks. WARNING: not yet connected to SIM call uplink; does not change the call microphone.'
            draft = $false
            prerelease = $true
            generate_release_notes = $false
          } | ConvertTo-Json -Compress
          $api = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases"
          $release = Invoke-RestMethod -Method Post -Uri $api -Headers $headers -Body $body -ContentType 'application/json'
          $upload = ($release.upload_url -replace '\{\?name,label\}$', '') + '?name=VS-Drama3-debug.apk'
          $uploadHeaders = @{
            Authorization = "Bearer $env:GH_VS_TOKEN"
            Accept = 'application/vnd.github+json'
            'User-Agent' = 'VS-APK-Builder'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $bytes = [System.IO.File]::ReadAllBytes($file)
          $asset = Invoke-RestMethod -Method Post -Uri $upload -Headers $uploadHeaders -Body $bytes -ContentType 'application/vnd.android.package-archive'
          if (-not $asset.browser_download_url) { throw 'Release asset URL missing' }
          "VS_APK_DOWNLOAD_URL=$($asset.browser_download_url)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii
          Write-Host "VS APK published: $($asset.browser_download_url)"

      - name: Publish VS build status for automatic review
        if: always()
        shell: powershell
        working-directory: .
        env:
          GH_VS_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $uri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/contents/.github/VS_BUILD_RESULT.json"
          $headers = @{
            Authorization = "Bearer $env:GH_VS_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
            'User-Agent' = 'VS-Android-Builder'
          }
          $state = @{
            run_id = $env:GITHUB_RUN_ID
            run_attempt = $env:GITHUB_RUN_ATTEMPT
            head_sha = $env:GITHUB_SHA
            workflow = 'vs-android-debug.yml'
            job_status = '${{ job.status }}'
            run_url = "https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            apk_download_url = $env:VS_APK_DOWNLOAD_URL
            updated_at = [DateTime]::UtcNow.ToString('o')
          }
          $json = $state | ConvertTo-Json -Depth 4
          $content = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($json))
          for ($attempt = 1; $attempt -le 4; $attempt++) {
            $existingSha = $null
            try {
              $old = Invoke-RestMethod -Uri $uri -Headers $headers -Method Get
              $existingSha = $old.sha
            } catch {
              if ($_.Exception.Response.StatusCode.value__ -ne 404) { throw }
            }
            $body = @{message="ci(vs): record build result $env:GITHUB_RUN_ID"; content=$content; branch='main'}
            if ($existingSha) { $body.sha = $existingSha }
            try {
              Invoke-RestMethod -Uri $uri -Headers $headers -Method Put -Body ($body | ConvertTo-Json -Compress) -ContentType 'application/json' | Out-Null
              Write-Host "VS build status recorded: $($state.job_status) (run $($state.run_id))"
              break
            } catch {
              if ($attempt -eq 4) { throw }
              Start-Sleep -Seconds (2*$attempt)
            }
          }
