name: Inspect AYO Premium folder and ZIP for voice output
on:
  push:
    branches:
      - voice-lab/ayo-output-search-20261104
    paths:
      - .github/workflows/ayo-output-search.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: [self-hosted, Windows]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - shell: pwsh
        name: Check AYO output paths in folder and ZIP
        run: ./tools/voice_lab/find_ayo_output.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ayo-output-location-report
          path: ${{ runner.temp }}/ayo-output-search/
          retention-days: 5
          if-no-files-found: ignore
