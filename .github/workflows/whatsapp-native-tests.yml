name: OnTrack Standalone WhatsApp Agent Tests
on:
  push:
    branches:
      - fix/standalone-whatsapp-support-agent-20261102
    paths:
      - 'saas/console/**'
      - 'tools/test_whatsapp_*'
      - '.github/workflows/whatsapp-native-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite,mbstring,pdo_mysql,openssl,curl
          coverage: none
      - name: Syntax checks
        run: |
          set -eu
          php -l saas/console/_core/Bootstrap.php
          php -l saas/console/_core/WhatsAppSupport.php
          php -l saas/console/_core/WhatsAppNativeAgent.php
          php -l saas/console/_core/Actions.php
          php -l saas/console/_core/Views.php
          php -l saas/console/whatsapp-worker.php
          php -l saas/console/whatsapp-webhook.php
          php -l tools/test_whatsapp_native_agent.php
      - name: Native WhatsApp test
        run: |
          set -eu
          rm -rf /tmp/ontrack-saas-demo
          php tools/test_whatsapp_native_agent.php
      - name: Existing human Inbox compatibility test
        run: |
          set -eu
          rm -rf /tmp/ontrack-saas-demo
          php tools/test_whatsapp_inbox.php
      - name: Existing optional WHMCS compatibility test
        run: |
          set -eu
          rm -rf /tmp/ontrack-saas-demo
          php tools/test_whatsapp_whmcs_bridge.php
