name: Android Outbound Callee First Regression
on:
  push:
    branches: ['fix/outbound-callee-first-20261102']
    paths:
      - 'saas/mobile/audio-proof/**'
      - '.github/workflows/outbound-callee-first-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  first-turn:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Check outbound direction and suppressed synthetic greeting
        run: |
          python3 - <<'PY'
          from pathlib import Path
          base=Path('saas/mobile/audio-proof/overlay/app/src/main/java/com/ontrack/voiceproof')
          live=(base/'MobileLiveCall.kt').read_text()
          service=(base/'MobileLinkService.kt').read_text()
          assert 'if(OutboundFirstTurn.sendInitialGreeting(outgoingCall))' in live
          assert 'remoteSpeechConfirmed=true' in live
          assert 'while(isActive && !stopped.get() && outgoingCall && !remoteSpeechConfirmed)' in live
          assert 'if(wasReady && handle.isNullOrBlank() && (!outgoingCall || remoteSpeechConfirmed))' in live
          assert 'outgoingCall=true' in service
          assert 'outgoingCall=outgoingCall' in service
          print('Outgoing/Incoming startup policy and reconnection regression PASS')
          PY
      - uses: actions/checkout@v5
        with:
          repository: jemcik/JemRec
          ref: f011062adfb3a2154c4d5a9cc4394032fb4345f2
          path: .build/jemrec
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - run: |
          sdkmanager --install "platforms;android-37.0" || sdkmanager --install "platforms;android-37"
          sdkmanager --install "platforms;android-36" || sdkmanager --install "platforms;android-36.0"
          sdkmanager --install "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply pinned native source overlay
        run: python3 saas/mobile/audio-proof/prepare.py .build/jemrec
      - name: Compile and run Kotlin first-turn behavior and PCM unit tests
        working-directory: .build/jemrec
        run: ./gradlew --no-daemon :app:testDebugUnitTest --tests 'com.ontrack.voiceproof.OutboundFirstTurnTest' --tests 'com.ontrack.voiceproof.LinkPcmTest'
      - name: Verify Android debug compilation
        working-directory: .build/jemrec
        run: ./gradlew --no-daemon :app:assembleDebug
