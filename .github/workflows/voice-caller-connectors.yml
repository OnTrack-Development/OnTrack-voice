name: OnTrack Voice Caller and Connector Security
on:
  push:
    branches: ['fix/flow-editor-ai-20261102']
    paths:
      - 'saas/console/_core/VoiceAccess.php'
      - 'saas/console/_core/Bootstrap.php'
      - 'saas/console/_core/Actions.php'
      - 'saas/console/_core/Views.php'
      - 'saas/console/_core/FlowAi.php'
      - 'saas/console/hooks/index.php'
      - 'tools/test_voice_access.php'
      - '.github/workflows/voice-caller-connectors.yml'
  pull_request:
    branches: [main]
    paths:
      - 'saas/console/**'
      - 'tools/test_voice_access.php'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  caller-and-scopes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite,mbstring,pdo_mysql,openssl,fileinfo
          coverage: none
      - name: PHP syntax
        run: |
          set -eu
          php -l saas/console/_core/VoiceAccess.php
          php -l saas/console/_core/Bootstrap.php
          php -l saas/console/_core/Actions.php
          php -l saas/console/_core/Views.php
          php -l saas/console/_core/FlowAi.php
          php -l saas/console/hooks/index.php
          php -l tools/test_voice_access.php
      - name: PIN, role downgrades, account isolation, connector facts
        run: php tools/test_voice_access.php
