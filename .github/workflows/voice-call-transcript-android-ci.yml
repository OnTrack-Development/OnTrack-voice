name: Voice Call Transcript Android Build (source HEAD)
on:
  pull_request:
    paths:
      - 'saas/mobile/audio-proof/**'
      - '.github/workflows/voice-call-transcript-android-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned, public telephony base
        uses: actions/checkout@v4
        with:
          repository: jemcik/JemRec
          ref: f011062adfb3a2154c4d5a9cc4394032fb4345f2
          path: .build/jemrec
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install compile platforms
        run: |
          sdkmanager --install "platforms;android-37.0" || sdkmanager --install "platforms;android-37"
          sdkmanager --install "platforms;android-36" || sdkmanager --install "platforms;android-36.0"
          sdkmanager --install "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply actual PR source
        run: python3 saas/mobile/audio-proof/prepare.py .build/jemrec
      - name: Verify Kotlin unit tests and Android compilation (no release)
        working-directory: .build/jemrec
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug
