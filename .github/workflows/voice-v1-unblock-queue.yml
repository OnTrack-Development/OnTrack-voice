name: OnTrack v1 release queue unblock
on:
  push:
    branches: [feat/voice-v1-minimal-console-20261106]
    paths: ['.github/workflows/voice-v1-unblock-queue.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  cancel_obsolete_candidate_qa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancel obsolete QA runs only; keep APK, production, and other branches
        uses: actions/github-script@v7
        with:
          script: |
            const owner=context.repo.owner,repo=context.repo.repo;
            const branch='feat/voice-v1-minimal-console-20261106';
            const keepBuild=42156616707;
            const names=new Set([
              'Google Live In-Call Failover QA',
              'Google Tenant Voice Key Isolation Tests',
              'Agent Studio Publish JSON Regression',
              'Call Details and Manager Handoff Regression',
              'Agent Studio Scenario Mode and API Locale QA'
            ]);
            const candidates=await github.paginate(github.rest.actions.listWorkflowRunsForRepo,{
              owner,repo,branch,per_page:100
            });
            let cancelled=0,skipped=0;
            for(const run of candidates){
              if(run.id===keepBuild||run.id===context.runId||!names.has(run.name)
                  ||run.event!=='pull_request'||!['in_progress','queued','waiting','pending'].includes(run.status)){
                skipped++;continue;
              }
              const belongsToPr=run.pull_requests?.some(pr=>pr.number===60);
              if(!belongsToPr){skipped++;continue;}
              try{
                await github.rest.actions.cancelWorkflowRun({owner,repo,run_id:run.id});
                core.info('CANCELLED_OLD_QA '+run.id+' '+run.name);
                cancelled++;
              }catch(error){
                core.warning('CANCEL_FAILED '+run.id+' '+error.message);
              }
            }
            core.info('ONTRACK_V1_QUEUE_UNBLOCK cancelled='+cancelled+' skipped='+skipped);
