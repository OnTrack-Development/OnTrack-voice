name: Release verified OnTrack Voice 0.3.6 to the installed app
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-verified-mobile.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: ontrack-verified-mobile-release
  cancel-in-progress: false
jobs:
  await_signed_build:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - name: Require successful pinned Android + emulator CI before any publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,os,time,urllib.request
          repo="OnTrack-Development/OnTrack-voice"
          source_run=41372781176
          source_sha="15086c87add7dd604fdac0addf1654e89bf99cda"
          url=f"https://api.github.com/repos/{repo}/actions/runs/{source_run}"
          for attempt in range(75):
              req=urllib.request.Request(url,headers={
                  "Authorization":"Bearer "+os.environ["GH_TOKEN"],
                  "Accept":"application/vnd.github+json",
                  "User-Agent":"OnTrack-Pinned-Release-Gate"})
              with urllib.request.urlopen(req,timeout=15) as response:
                  run=json.load(response)
              assert run["head_sha"]==source_sha, "Wrong APK source SHA"
              assert run["event"]=="push" and run["head_branch"]=="fix/console-pricing-connection-ui-20261102", "Wrong release source event/branch"
              if run["status"]=="completed":
                  assert run["conclusion"]=="success", "Pinned Android CI did not pass"
                  print("PINNED_ANDROID_BUILD_PASSED",source_run,source_sha)
                  break
              print("Waiting for pinned signed Android build",source_run,attempt+1,flush=True)
              time.sleep(20)
          else:
              raise RuntimeError("Pinned Android CI timeout; release blocked")
          PY

  publish_ota:
    needs: await_signed_build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: a6d60ca4e7702fb8cbac19b0d152fc18af17abcd
          persist-credentials: false
      - uses: actions/download-artifact@v5
        with:
          name: OnTrack-Voice-0.3.6
          repository: OnTrack-Development/OnTrack-voice
          run-id: 41372781176
          github-token: ${{ github.token }}
          path: .build/downloaded
      - name: Verify signed revision 24 / native version 27 before host queue
        run: |
          python3 -m py_compile tools/queue_mobile_ota.py tools/queue_mobile_native.py saas/mobile/ota/deploy.py saas/mobile/ota/native_deploy.py
          python3 tools/test_mobile_release_gate.py
          python3 tools/test_mobile_ui_contract.py
          python3 - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0,"tools")
          from queue_mobile_ota import verify as verify_ui
          from queue_mobile_native import verify as verify_native
          _,_,ui=verify_ui(Path(".build/downloaded/ota"))
          _,_,apk=verify_native(Path(".build/downloaded/native"))
          assert ui["revision"]==24 and ui["max_native"]>=27
          assert apk["version_code"]==27 and apk["version_name"]=="0.3.6-ota"
          print("SIGNED_OTA_24_AND_NATIVE_27_VERIFIED")
          PY
      - name: Prove already-installed signed UI OTA24 matches this APK build
        env:
          GH_TOKEN: ${{ github.token }}
          MOBILE_UI_ALREADY_PUBLISHED_RUN_ID: '41373097216'
        run: |
          python3 - <<'PY'
          import json,os,sys
          from pathlib import Path
          sys.path.insert(0,"tools")
          from queue_mobile_native import wait_queue, require_successful_ui_release
          _,current,report=wait_queue()
          signed=json.loads(Path(".build/downloaded/ota/latest.json").read_text())
          require_successful_ui_release(current,report,int(os.environ["MOBILE_UI_ALREADY_PUBLISHED_RUN_ID"]),signed)
          print("EXACT_SIGNED_UI24_HOST_RECEIPT_MATCHED")
          PY

  publish_native:
    needs: publish_ota
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: a6d60ca4e7702fb8cbac19b0d152fc18af17abcd
          persist-credentials: false
      - uses: actions/download-artifact@v5
        with:
          name: OnTrack-Voice-0.3.6
          repository: OnTrack-Development/OnTrack-voice
          run-id: 41372781176
          github-token: ${{ github.token }}
          path: .build/downloaded
      - name: Require verified existing signed UI 24 host success and queue native 27
        env:
          GH_TOKEN: ${{ github.token }}
          MOBILE_RELEASE_SOURCE_RUN_ID: '41372781176'
          MOBILE_UI_ALREADY_PUBLISHED_RUN_ID: '41373097216'
        run: python3 tools/queue_mobile_native.py .build/downloaded/native
