name: Publish OnTrack Pilot PHP Server (No APK)
on:
  pull_request:
    paths:
      - 'saas/mobile/server/**'
      - 'tools/deploy_mobile_server.py'
      - 'tools/pack_mobile_server.py'
      - 'tools/queue_mobile_server.py'
      - 'tools/test_mobile_server_deploy.py'
      - 'tools/queue_saas_console.py'
      - '.github/workflows/mobile-server-publish.yml'
  push:
    branches: [main]
    paths:
      - 'saas/mobile/server/**'
      - 'tools/deploy_mobile_server.py'
      - 'tools/queue_mobile_server.py'
      - 'tools/test_mobile_server_deploy.py'
      - 'tools/queue_saas_console.py'
      - '.github/workflows/mobile-server-publish.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pilot-php-server-publisher
  cancel-in-progress: false
env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: 'utf-8'
jobs:
  check:
    runs-on: [self-hosted, Windows, X64, ontrack-signing-recovery]
    timeout-minutes: 8
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax and DNC/predial/auth-fallback regression
        run: |
          $ErrorActionPreference = 'Stop'
          $env:CI = 'true'
          Get-ChildItem 'saas\mobile\server' -Filter '*.php' | ForEach-Object {
            & php -l $_.FullName | Out-Null
            if ($LASTEXITCODE -ne 0) { throw ('PHP lint failed: ' + $_.FullName) }
          }
          foreach ($t in @('tools/test_mobile_call_ledger.php', 'tools/test_mobile_auth_fallback.php', 'tools/test_mobile_call_reports.php', 'tools/test_pilot_workspace.php')) {
            & php $t
            if ($LASTEXITCODE -ne 0) { throw ('Test failed: ' + $t) }
          }
      - name: Pinned archive, rollback and secret-preservation regression
        run: |
          $ErrorActionPreference = 'Stop'
          & python -m py_compile tools/deploy_mobile_server.py tools/pack_mobile_server.py tools/queue_mobile_server.py tools/queue_saas_console.py tools/test_mobile_server_deploy.py
          if ($LASTEXITCODE -ne 0) { throw 'Python syntax check failed' }
          & python -m unittest tools.test_mobile_server_deploy.PilotServerPublishTest.test_traversal_and_symlink_in_archive_rejected tools.test_mobile_server_deploy.PilotServerPublishTest.test_duplicate_member_rejected tools.test_mobile_server_deploy.PilotServerPublishTest.test_packaging_excludes_tracked_auth_verifier tools.test_mobile_server_deploy.PilotServerPublishTest.test_non_https_or_untrusted_artifact_rejected
          if ($LASTEXITCODE -ne 0) { throw 'Mobile server deploy unit tests failed' }
  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: [self-hosted, Windows, X64, ontrack-signing-recovery]
    timeout-minutes: 12
    defaults:
      run:
        shell: pwsh
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Package PHP pilot files only (exclude host auth.sha256 and private state)
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -Path 'dist\pilot-server' -ItemType Directory -Force | Out-Null
          & python tools/pack_mobile_server.py saas/mobile/server dist/pilot-server/release.tar.gz
          if ($LASTEXITCODE -ne 0) { throw 'pack_mobile_server failed' }
          & python -c "import hashlib, pathlib, sys; sys.path.insert(0, 'tools'); from deploy_mobile_server import parse_release; raw=pathlib.Path('dist/pilot-server/release.tar.gz').read_bytes(); members=parse_release(raw); assert 'auth.sha256' not in members; pathlib.Path('dist/pilot-server/release.sha256').write_text(hashlib.sha256(raw).hexdigest()+'\n'); print('PILOT_PHP_ONLY_ARCHIVE_VERIFIED', len(members))"
          if ($LASTEXITCODE -ne 0) { throw 'Release archive verification failed' }
      - name: Upload pinned PHP-only release
        uses: actions/upload-artifact@v4
        with:
          name: OnTrack-Pilot-PHP-Server
          path: dist/pilot-server/
          retention-days: 14
          if-no-files-found: error
      - name: Queue release on existing host Cron worker (manual dispatch only)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/queue_mobile_server.py
