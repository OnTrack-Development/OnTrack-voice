name: Publish OnTrack Voice Dynamic Agent Studio
on:
  push:
    branches: [main]
    paths: ['.github/workflows/voice-saas-publish.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ontrack-saas-production-release
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 8f48bab6940709650456135b85c4b5a4aed99e4a
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite,mbstring,pdo_mysql,openssl,fileinfo
          coverage: none
      - name: Validate pinned production console and user-isolated Agent Flows
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "8f48bab6940709650456135b85c4b5a4aed99e4a"
          find saas/console -name '*.php' -type f -print0 | xargs -0 -n1 php -l >/dev/null
          node --check saas/console/assets/js/app.js
          node --check saas/console/assets/js/flow-graph.js
          node --check saas/console/assets/js/graph-routing.js
          node tools/test_graph_routing.cjs
          node --check saas/console/assets/js/pairing-qr.js
          node --check saas/console/assets/js/mfa-qr.js
          node tools/test_voice_qr.cjs
          node tools/test_floating_flow_ui.cjs
          php tools/test_flow_ai_chat.php
          node tools/test_console_ajax_ui.cjs
          python3 -m py_compile tools/deploy_saas_console.py tools/queue_saas_console.py
          # Each PHP integration suite uses an isolated, ephemeral SQLite demo fixture.
          # The chat memory suite seeds schema/DNC markers; starting SaaS smoke with
          # its preexisting marker would invalidate the legacy backfill regression.
          rm -rf /tmp/ontrack-saas-demo
          php tools/test_voice_saas_console.php
          php tools/test_console_pricing_ui.php
          php tools/test_tenant_workspace.php
          php tools/test_tenant_device_pairing.php
          php tools/test_published_agent_flow.php
          php tools/test_admin_mfa.php
          php tools/test_flow_templates.php
          php tools/test_answer_policy.php
          php tools/test_google_provider_config.php
          php tools/test_voice_trial_and_ui.php
          php tools/test_verified_signup.php
          php tools/test_console_checkout.php
          php tools/test_console_kashier_webhook.php
          php tools/test_verified_checkout_settlement.php
          php tools/test_voice_sso.php
          python3 tools/test_voice_sso_http.py
          php tools/test_agent_flow_preview.php
          php tools/test_flow_ai_sources.php
          php tools/test_voice_access.php
          php tools/test_dynamic_agent_studio.php
          php tools/test_ai_agent_profile.php
          php tools/test_flow_ai_stress.php
          php tools/test_whatsapp_inbox.php
          php tools/test_whatsapp_whmcs_bridge.php
          php tools/test_whatsapp_native_agent.php

  publish:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 8f48bab6940709650456135b85c4b5a4aed99e4a
          persist-credentials: false
      - name: Package pinned production console with rollback support
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "8f48bab6940709650456135b85c4b5a4aed99e4a"
          mkdir -p dist/saas-console
          tar --format=ustar -czf dist/saas-console/release.tar.gz -C saas console
          sha256sum dist/saas-console/release.tar.gz | awk '{print $1}' > dist/saas-console/release.sha256
      - uses: actions/upload-artifact@v5
        with:
          name: OnTrack-SaaS-Console
          path: dist/saas-console/
          retention-days: 14
          if-no-files-found: error
      - name: Queue signed-source console release after acknowledged host job
        env:
          GH_TOKEN: ${{ github.token }}
        run: GITHUB_SHA=8f48bab6940709650456135b85c4b5a4aed99e4a python3 tools/queue_saas_console.py
