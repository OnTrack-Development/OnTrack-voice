name: OnTrack billing invoices and payments v58 direct SSH publish
on:
  push:
    branches: [feat/io-premium-native-v51-20261107]
    paths:
      - '.github/workflows/voice-saas-billing-v58-direct-publish.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ontrack-saas-billing-v58-direct
  cancel-in-progress: false
jobs:
  verify-and-publish:
    runs-on: [self-hosted, Windows, X64, ontrack-signing-recovery]
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 72d7dd069db15c89ff6abe0f6c36ece645194b3f
          path: .build/billing-v58-baseline
          persist-credentials: false
      - name: Lint exact PHP changes and verify tenant plan regressions
        run: |
          $ErrorActionPreference='Stop'
          & python -m py_compile tools/deploy_saas_billing_v58.py
          if($LASTEXITCODE -ne 0){throw 'Direct SSH deploy script invalid'}
          $paths=@('_core/Checkout.php','_core/Bootstrap.php','_core/Actions.php','_core/Views.php','_core/OrderClaim.php','index.php','_core/BillingInvoices.php')
          foreach($path in $paths){
            & php -l ('saas/console/'+$path)
            if($LASTEXITCODE -ne 0){throw ('Invalid PHP '+$path)}
          }
          $tests=@('tools/test_v1_site05_plan_transitions.php','tools/test_admin_direct_plan_grants.php','tools/test_reseller_subscription_catalog.php','tools/test_invoice_billing_v58.php')
          $n=0
          foreach($test in $tests) {
            $n++
            $env:ONTRACK_CI_NAMESPACE='billing58_'+$env:GITHUB_RUN_ID+'_'+$n
            & php $test
            if($LASTEXITCODE -ne 0){throw ('SUBSCRIPTION_REGRESSION_FAILED '+$test)}
          }
          Remove-Item Env:\ONTRACK_CI_NAMESPACE -ErrorAction SilentlyContinue
          Write-Host 'BILLING_V58_ISOLATED_TESTS_PASS'
      - name: Stage reviewed old/new PHP through authorized direct SSH
        run: |
          $ErrorActionPreference='Stop'
          $key=Join-Path $env:USERPROFILE '.ssh\ontrack_publish_ed25519'
          if(!(Test-Path -LiteralPath $key)){throw 'Authorized deploy identity unavailable'}
          $ssh=@('-i',$key,'-o','BatchMode=yes','-o','IdentitiesOnly=yes','-o','StrictHostKeyChecking=yes','-o','ConnectTimeout=12')
          $remote='appontrack@65.21.208.232'
          $stage='/home/appontrack/.ontrack-mobile/saas-billing-v58'
          & ssh.exe @ssh -p 7195 $remote ('umask 077; mkdir -p '+$stage+'/old/_core '+$stage+'/new/_core; chmod 700 '+$stage)
          if($LASTEXITCODE -ne 0){throw 'Direct SSH stage creation failed'}
          $paths=@('Checkout.php','Bootstrap.php','Actions.php','Views.php','OrderClaim.php','BillingInvoices.php','index.php')
          foreach($name in $paths){
            $relative=if($name -eq 'index.php'){'index.php'}else{'_core/'+$name}
            $old='.build/billing-v58-baseline/saas/console/'+$relative
            $new='saas/console/'+$relative
            if($name -ne 'BillingInvoices.php'){
              & scp.exe @ssh -P 7195 $old ($remote+':'+$stage+'/old/'+$relative)
              if($LASTEXITCODE -ne 0){throw ('Baseline upload failed '+$name)}
            }
            & scp.exe @ssh -P 7195 $new ($remote+':'+$stage+'/new/'+$relative)
            if($LASTEXITCODE -ne 0){throw ('Candidate upload failed '+$name)}
          }
          & scp.exe @ssh -P 7195 tools/deploy_saas_billing_v58.py ($remote+':'+$stage+'/deploy.py')
          if($LASTEXITCODE -ne 0){throw 'Direct deploy installer upload failed'}
          Write-Host 'BILLING_V58_STAGED_OVER_DIRECT_SSH'
      - name: Atomic direct site install and live PHP schema verification
        run: |
          $ErrorActionPreference='Stop'
          $key=Join-Path $env:USERPROFILE '.ssh\ontrack_publish_ed25519'
          $ssh=@('-i',$key,'-o','BatchMode=yes','-o','IdentitiesOnly=yes','-o','StrictHostKeyChecking=yes','-o','ConnectTimeout=12')
          $remote='appontrack@65.21.208.232'
          & ssh.exe @ssh -p 7195 $remote 'python3 /home/appontrack/.ontrack-mobile/saas-billing-v58/deploy.py'
          if($LASTEXITCODE -ne 0){throw 'Rollback-safe plans publication failed'}
          $get=Invoke-WebRequest -Uri ('https://app.ontrackegy.com/?plans57='+$env:GITHUB_RUN_ID) -TimeoutSec 35 -MaximumRedirection 3 -SkipHttpErrorCheck
          if([int]$get.StatusCode -ge 500){throw 'Site returns an HTTP 5xx after plans publish'}
          Write-Host 'BILLING_V58_DIRECT_SSH_DEPLOY_PASS'
