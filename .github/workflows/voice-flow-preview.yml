name: OnTrack Agent Flow Text Preview
on:
  pull_request:
    branches: [main]
    paths:
      - 'saas/console/_core/FlowPreview.php'
      - 'saas/console/flow-preview.php'
      - 'saas/console/assets/js/flow-graph.js'
      - 'tools/test_agent_flow_preview.php'
      - 'tools/test_agent_flow_preview_http.php'
      - 'tools/flow_preview_http_router.php'
      - 'tools/test_voice_saas_console.php'
      - '.github/workflows/voice-flow-preview.yml'
  push:
    branches: [main]
    paths:
      - 'saas/console/_core/FlowPreview.php'
      - 'saas/console/flow-preview.php'
      - 'saas/console/assets/js/flow-graph.js'
      - 'tools/test_agent_flow_preview.php'
      - 'tools/test_agent_flow_preview_http.php'
      - 'tools/flow_preview_http_router.php'
      - 'tools/test_voice_saas_console.php'
      - '.github/workflows/voice-flow-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
jobs:
  preview-regression:
    runs-on: [self-hosted, Windows, X64, ontrack-signing-recovery]
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: PHP and browser script syntax
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($f in @('saas/console/_core/FlowPreview.php', 'saas/console/flow-preview.php', 'tools/test_agent_flow_preview.php', 'tools/test_agent_flow_preview_http.php', 'tools/flow_preview_http_router.php')) {
            & php -l $f | Out-Null
            if ($LASTEXITCODE -ne 0) { throw ('PHP lint failed: ' + $f) }
          }
          & node --check saas/console/assets/js/flow-graph.js
          if ($LASTEXITCODE -ne 0) { throw 'flow-graph.js syntax failed' }
      - name: Seeded DB, flow traversal, HTTP preview and tenant isolation
        run: |
          $ErrorActionPreference = 'Stop'
          $env:CI = 'true'
          $i = 0
          foreach ($t in @('tools/test_voice_saas_console.php', 'tools/test_agent_flow_preview.php', 'tools/test_agent_flow_preview_http.php')) {
            $i++
            $env:ONTRACK_CI_NAMESPACE = "flowprev-$env:GITHUB_RUN_ID-$i"
            & php $t
            if ($LASTEXITCODE -ne 0) { throw ('Flow preview test failed: ' + $t) }
          }
