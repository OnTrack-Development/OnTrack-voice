name: IO Premium fast PHP and Android compile check
on:
  push:
    branches: [feat/v1-io-premium-20261107]
    paths:
      - 'saas/mobile/audio-proof/**'
      - 'saas/console/**'
      - 'saas/mobile/ota/ui.html'
      - '.github/workflows/voice-io-premium-linux-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  php:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring,pdo_sqlite,pdo_mysql,openssl
      - name: PHP source and IO Premium selection
        run: |
          find saas/console -name '*.php' -type f -print0 | xargs -0 -n1 php -l
          php tools/test_voice_saas_console.php
  android-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install Android toolchain
        run: |
          sdkmanager --install "platforms;android-37" "platforms;android-36" "build-tools;36.0.0"
      - uses: actions/checkout@v4
        with:
          repository: jemcik/JemRec
          ref: f011062adfb3a2154c4d5a9cc4394032fb4345f2
          path: .build/jemrec
          persist-credentials: false
      - name: Patch exact upstream source
        run: python3 saas/mobile/audio-proof/prepare.py .build/jemrec
      - name: Compile official Kotlin Live SDK and verify streamed PCM
        working-directory: .build/jemrec
        run: |
          ./gradlew --no-daemon :app:compileDebugKotlin :app:testDebugUnitTest --tests com.ontrack.voiceproof.PremiumPcmTest
