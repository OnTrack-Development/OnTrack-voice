name: OnTrack v78 SOG Agent Studio HTTP 404 route and WAF payload fix
on:
  push:
    branches: [feat/io-premium-native-v51-20261107]
    paths:
      - '.github/workflows/voice-saas-studio-v78-direct-publish.yml'
      - 'tools/deploy_saas_studio_v78.py'
      - 'tools/test_v78_agent_packed_save_e2e.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # Cancel obsolete v76 UI-only uploads, which lack the new backend decoder.
  group: ontrack-saas-v76-sog-studio-save
  cancel-in-progress: true
jobs:
  test-and-publish:
    name: Real isolated publish, atomic SSH rollout and typed-JSON HTTP verification
    runs-on: [self-hosted, Windows, X64, ontrack-signing-recovery]
    timeout-minutes: 24
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: JS and PHP lint plus existing Agent Studio regressions
        run: |
          $ErrorActionPreference='Stop'
          & node --check saas/console/assets/js/app.js
          if($LASTEXITCODE -ne 0){throw 'Studio JS syntax failed'}
          & node --check saas/console/assets/js/flow-graph.js
          if($LASTEXITCODE -ne 0){throw 'Flow JS syntax failed'}
          foreach($file in @('saas/console/_core/Actions.php','saas/console/_core/Views.php')){
            & php -l $file
            if($LASTEXITCODE -ne 0){throw ('PHP syntax failed '+$file)}
          }
          & node tools/test_console_ajax_ui.cjs
          if($LASTEXITCODE -ne 0){throw 'Existing AJAX regression failed'}
          & node tools/test_v76_sog_studio_submission.cjs
          if($LASTEXITCODE -ne 0){throw 'Legacy Studio regression failed'}
          & python -m py_compile tools/deploy_saas_studio_v78.py tools/test_v78_agent_packed_save_e2e.py
          if($LASTEXITCODE -ne 0){throw 'Python release syntax failed'}
          $php=@'
          <?php
          require_once 'saas/console/_core/Bootstrap.php';
          require_once 'saas/console/_core/Views.php';
          $html=form_start('update_agent','/?tab=agents','class="agent-studio-form" action="'.e(white_label_url('/')).'"');
          if(!str_contains($html,'action="/"'))throw new RuntimeException('canonical_action_missing');
          echo "V78_SOG_CANONICAL_FORM_ACTION_PASS\n";
          '@
          $php | & php
          if($LASTEXITCODE -ne 0){throw 'Canonical form action wrong'}
          Write-Host 'V78_JS_PHP_CANONICAL_ACTION_STATIC_AND_REGRESSION_PASS'
      - name: Real isolated authenticated draft/publish and malformed bundle refusal
        run: |
          $ErrorActionPreference='Stop'
          & python tools/test_agent_publish_ajax.py
          if($LASTEXITCODE -ne 0){throw 'PHP typed AJAX contract failed'}
          & python tools/test_v76_agent_save_e2e.py
          if($LASTEXITCODE -ne 0){throw 'Legacy unbundled Agent Studio regression failed'}
          & python tools/test_v78_agent_packed_save_e2e.py
          if($LASTEXITCODE -ne 0){throw 'Bounded Unicode SOG bundle save/publish failed'}
          Write-Host 'V78_SOG_PACKED_UNICODE_REAL_PHP_SAVE_AND_PUBLISH_E2E_PASS'
      - name: Verify canonical unauthenticated POST crosses Apache to JSON PHP
        run: |
          $ErrorActionPreference='Stop'
          $headers=@{'X-Requested-With'='XMLHttpRequest';'Accept'='application/json'}
          $body='action=update_agent&csrf=invalid&agent_id=0&studio_fields_b64=e30'
          $resp=Invoke-WebRequest -Uri 'https://app.ontrackegy.com/' -Method Post -Headers $headers -ContentType 'application/x-www-form-urlencoded' -Body $body -SkipHttpErrorCheck -MaximumRedirection 0 -TimeoutSec 25
          if([int]$resp.StatusCode -ne 401 -or !(($resp.Headers['Content-Type']|Out-String).Contains('application/json'))){
            throw ('Canonical POST blocked before PHP or unexpected: '+[int]$resp.StatusCode)
          }
          $parsed=$resp.Content|ConvertFrom-Json
          if($parsed.ok -ne $false){throw 'Typed PHP anonymous rejection malformed'}
          Write-Host 'V78_CANONICAL_POST_REACHES_PHP_TYPED_JSON_PASS'
      - name: Stage three version-locked host sources and rollback publisher by SSH
        run: |
          $ErrorActionPreference='Stop'
          $key=Join-Path $env:USERPROFILE '.ssh\ontrack_publish_ed25519'
          if(!(Test-Path -LiteralPath $key)){throw 'Approved SSH identity unavailable'}
          $ssh=@('-i',$key,'-o','BatchMode=yes','-o','IdentitiesOnly=yes','-o','StrictHostKeyChecking=yes','-o','ConnectTimeout=12')
          $remote='appontrack@65.21.208.232'
          $stage='/home/appontrack/.ontrack-mobile/saas-studio-v78'
          & ssh.exe @ssh -p 7195 $remote ('umask 077; mkdir -p '+$stage+'/_core '+$stage+'/assets/js; chmod 700 '+$stage+' '+$stage+'/_core '+$stage+'/assets '+$stage+'/assets/js')
          if($LASTEXITCODE -ne 0){throw 'Private v78 staging failed'}
          $assets=@(
            [pscustomobject]@{Source='saas/console/_core/Actions.php';Dest="$stage/_core/Actions.php"}
            [pscustomobject]@{Source='saas/console/_core/Views.php';Dest="$stage/_core/Views.php"}
            [pscustomobject]@{Source='saas/console/assets/js/app.js';Dest="$stage/assets/js/app.js"}
            [pscustomobject]@{Source='tools/deploy_saas_studio_v78.py';Dest="$stage/deploy.py"}
          )
          foreach($asset in $assets){
            $source=[string]$asset.Source
            if(!(Test-Path -LiteralPath $source -PathType Leaf)){throw ('Missing verified file '+$source)}
            $target='{0}:{1}' -f $remote,[string]$asset.Dest
            & scp.exe @ssh -P 7195 $source $target
            if($LASTEXITCODE -ne 0){throw ('Staging failed '+$source)}
          }
          Write-Host 'V78_PRIVATE_STAGING_FOUR_SOURCES_PASS'
      - name: Atomic PHP-first host publish then live JS / auth / SOG HTTP smoke
        run: |
          $ErrorActionPreference='Stop'
          $key=Join-Path $env:USERPROFILE '.ssh\ontrack_publish_ed25519'
          $ssh=@('-i',$key,'-o','BatchMode=yes','-o','IdentitiesOnly=yes','-o','StrictHostKeyChecking=yes','-o','ConnectTimeout=12')
          $remote='appontrack@65.21.208.232'
          & ssh.exe @ssh -p 7195 $remote 'python3 /home/appontrack/.ontrack-mobile/saas-studio-v78/deploy.py'
          if($LASTEXITCODE -ne 0){throw 'Atomic v78 host publication failed'}
          & ssh.exe @ssh -p 7195 $remote 'set -eu; /opt/cpanel/ea-php83/root/usr/bin/php -l /home/appontrack/public_html/_core/Actions.php; /opt/cpanel/ea-php83/root/usr/bin/php -l /home/appontrack/public_html/_core/Views.php; echo V78_LIVE_PHP83_STUDIO_AND_CANONICAL_FORM_PASS'
          if($LASTEXITCODE -ne 0){throw 'Canonical PHP8.3 post-publish lint failed'}
          $uri='https://app.ontrackegy.com/saas/console/assets/js/app.js?v78='+$env:GITHUB_RUN_ID
          $js=Invoke-WebRequest -Uri $uri -SkipHttpErrorCheck -TimeoutSec 25
          if([int]$js.StatusCode -ne 200 -or !$js.Content.Contains("studio_fields_b64")){
            throw ('Live Studio script stale or not found: '+[int]$js.StatusCode)
          }
          $header=@{'X-Requested-With'='XMLHttpRequest';'Accept'='application/json'}
          $resp=Invoke-WebRequest -Uri 'https://app.ontrackegy.com/' -Method Post -Headers $header -ContentType 'application/x-www-form-urlencoded' -Body 'action=update_agent&csrf=invalid&studio_fields_b64=e30' -SkipHttpErrorCheck -MaximumRedirection 0 -TimeoutSec 25
          $ct=($resp.Headers['Content-Type']|Out-String)
          if([int]$resp.StatusCode -ne 401 -or !$ct.Contains('application/json')){
            throw ('Live Studio POST did not return typed PHP JSON, HTTP '+[int]$resp.StatusCode)
          }
          Write-Host 'V78_LIVE_SOG_STUDIO_CANONICAL_POST_JS_AND_PHP83_DEPLOY_PASS'
