name: PR90 clean obsolete queued CI before v70 release
on:
  push:
    branches: ['ops/voice-v70-pr90-queue-cleanup-20261113']
    paths: ['.github/workflows/pr90-v70-queued-run-cleanup.yml']
permissions:
  contents: read
  actions: write
jobs:
  cancel-obsolete-queued:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
      KEEP_SHA: 7adc1261417ea59edcca2142bd7d451226aac551
    steps:
      - name: Cancel ONLY queued old SHA PR90 runs, keep current v70 untouched
        run: |
          python3 - <<'PY'
          import json,os,urllib.request,urllib.error
          api="https://api.github.com/repos/OnTrack-Development/OnTrack-voice/actions/runs"
          tok=os.environ["GH_TOKEN"]
          keep=os.environ["KEEP_SHA"]
          headers={"Authorization":"Bearer "+tok,"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28","User-Agent":"OnTrack-v70-safe-queue-cleanup"}
          canceled=[];skipped=[]
          for page in range(1,5):
              req=urllib.request.Request(api+f"?per_page=100&page={page}",headers=headers)
              with urllib.request.urlopen(req,timeout=20) as f: data=json.load(f)
              for run in data.get("workflow_runs",[]):
                  if run.get("head_branch")!="feat/audio-stability-p0-v69" or run.get("event")!="pull_request":continue
                  if run.get("head_sha")==keep or run.get("status")!="queued":
                      skipped.append(run["id"]);continue
                  cid=run["id"]
                  request=urllib.request.Request(api+"/"+str(cid)+"/cancel",method="POST",headers=headers,data=b"")
                  try:
                      with urllib.request.urlopen(request,timeout=12) as resp:
                          if resp.status not in (202,204):raise RuntimeError("unexpected cancellation response")
                      canceled.append(cid)
                  except urllib.error.HTTPError as error:
                      if error.code not in (404,409,422):raise
              if len(data.get("workflow_runs",[]))<100:break
          print(json.dumps({"current_v70_sha_preserved":keep,"canceled_older_queued":canceled,"preserved_queued_or_active":skipped[:35]}))
          PY
