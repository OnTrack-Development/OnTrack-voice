name: OnTrack v61 precision dark and light interface direct publish
on:
  push:
    branches: [feat/io-premium-native-v51-20261107]
    paths:
      - '.github/workflows/voice-saas-ui-v61-direct-publish.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ontrack-saas-ui-v61-direct
  cancel-in-progress: false
jobs:
  verify-publish:
    runs-on: [self-hosted, Windows, X64, ontrack-signing-recovery]
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate light/dark precision, contrast, RTL and mobile
        run: |
          $ErrorActionPreference='Stop'
          & python -m py_compile tools/deploy_saas_ui_v61.py tools/test_ui_precision_v61.py
          if($LASTEXITCODE -ne 0){throw 'ui publisher syntax invalid'}
          & python tools/test_ui_precision_v61.py
          if($LASTEXITCODE -ne 0){throw 'style v61 visual contract failed'}
          & php -l saas/console/_core/Views.php
          if($LASTEXITCODE -ne 0){throw 'site layout syntax invalid'}
          Write-Host 'OTV_STYLE_V61_ISOLATED_VALIDATION_PASS'
      - name: Upload reviewed CSS and rollback-safe publisher by direct SSH
        run: |
          $ErrorActionPreference='Stop'
          $key=Join-Path $env:USERPROFILE '.ssh\ontrack_publish_ed25519'
          if(!(Test-Path -LiteralPath $key)){throw 'Authorized deploy identity unavailable'}
          $ssh=@('-i',$key,'-o','BatchMode=yes','-o','IdentitiesOnly=yes','-o','StrictHostKeyChecking=yes','-o','ConnectTimeout=12')
          $remote='appontrack@65.21.208.232'
          $stage='/home/appontrack/.ontrack-mobile/saas-ui-v61'
          & ssh.exe @ssh -p 7195 $remote ('umask 077; mkdir -p '+$stage+'; chmod 700 '+$stage)
          if($LASTEXITCODE -ne 0){throw 'CSS staging permission failed'}
          & scp.exe @ssh -P 7195 saas/console/assets/css/app.css ($remote+':'+$stage+'/app.css')
          if($LASTEXITCODE -ne 0){throw 'CSS upload failed'}
          & scp.exe @ssh -P 7195 tools/deploy_saas_ui_v61.py ($remote+':'+$stage+'/deploy.py')
          if($LASTEXITCODE -ne 0){throw 'CSS publisher upload failed'}
          Write-Host 'OTV_STYLE_V61_DIRECT_SSH_STAGED'
      - name: Publish actual site CSS and verify public CSS endpoint
        run: |
          $ErrorActionPreference='Stop'
          $key=Join-Path $env:USERPROFILE '.ssh\ontrack_publish_ed25519'
          $ssh=@('-i',$key,'-o','BatchMode=yes','-o','IdentitiesOnly=yes','-o','StrictHostKeyChecking=yes','-o','ConnectTimeout=12')
          $remote='appontrack@65.21.208.232'
          & ssh.exe @ssh -p 7195 $remote 'python3 /home/appontrack/.ontrack-mobile/saas-ui-v61/deploy.py'
          if($LASTEXITCODE -ne 0){throw 'Direct production CSS deployment failed'}
          $cssUrl='https://app.ontrackegy.com/saas/console/assets/css/app.css?v=61-'+$env:GITHUB_RUN_ID
          $res=Invoke-WebRequest -Uri $cssUrl -TimeoutSec 40 -MaximumRedirection 1 -SkipHttpErrorCheck
          if([int]$res.StatusCode -ne 200){throw ('Public CSS not served - HTTP '+$res.StatusCode)}
          if(-not $res.Content.Contains('OTV_STYLE_V61_BEGIN') -or
             -not $res.Content.Contains('--bg:#0d1015;') -or
             -not $res.Content.Contains('--bg:#f5f7fa;')){
            throw 'Public website still serving stale or wrong CSS'
          }
          Write-Host 'OTV_STYLE_V61_PUBLIC_SITE_CSS_VERIFIED_PASS'
