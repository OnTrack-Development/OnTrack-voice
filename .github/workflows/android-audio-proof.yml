name: Android SIM Audio Proof
on:
  push:
    branches: [main]
    # Native builds only for Android/telephony/backend changes.
    # Visual HTML OTA now has its own signed no-APK pipeline.
    paths:
      - 'saas/mobile/audio-proof/**'
      # Server PHP has its own Voice P1 P2 backend regression. A backend-only
      # change must NOT rebuild/publish an unrelated signed native Android APK.
      - 'saas/mobile/patch_live_session.py'
      - 'saas/mobile/ota/native_release.json'
      - 'saas/mobile/ota/native_deploy.py'
      # Release tooling changes are verified in mobile-release-gate.yml;
      # they must not build or publish a new APK by themselves.
  pull_request:
    branches: [main]
    paths:
      - 'saas/mobile/audio-proof/**'
      - '.github/workflows/android-audio-proof.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-proof-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - name: Validate mobile PHP endpoints
        run: |
          for source in saas/mobile/server/*.php; do php -l "$source"; done
          python3 -m py_compile saas/mobile/patch_live_session.py
          python3 tools/test_mobile_ota.py
          php tools/test_mobile_call_ledger.php
          php tools/test_pilot_workspace.php
          php tools/test_kashier_signature.php
          find saas/app/Support saas/app/Http/Controllers/App saas/app/Http/Controllers/Api saas/database/migrations saas/config -name '*.php' -exec php -l {} \; >/dev/null
          echo "Voice PHP, plan and Kashier syntax PASS"
      - uses: actions/checkout@v5
        with:
          repository: jemcik/JemRec
          ref: f011062adfb3a2154c4d5a9cc4394032fb4345f2
          path: .build/jemrec
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Keep the test signing identity for subsequent diagnostic updates
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: ontrack-voiceproof-debug-signing-v1
      - uses: android-actions/setup-android@v4
      - name: Install pinned Android build platforms
        run: |
          sdkmanager --install "platforms;android-37.0" || sdkmanager --install "platforms;android-37"
          sdkmanager --install "platforms;android-36" || sdkmanager --install "platforms;android-36.0"
          sdkmanager --install "build-tools;36.0.0"
          test -f "$ANDROID_HOME/platforms/android-36/android.jar"
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply OnTrack source overlay
        run: python3 saas/mobile/audio-proof/prepare.py .build/jemrec
      - name: Test audio import and daemon state logic
        working-directory: .build/jemrec
        run: ./gradlew --no-daemon :app:testDebugUnitTest --tests 'com.ontrack.voiceproof.PcmWavTest' --tests 'com.ontrack.voiceproof.SetupDiagnosticFormatTest' --tests 'com.ontrack.voiceproof.ProofExportTest' --tests 'com.ontrack.voiceproof.LinkPcmTest' --tests 'com.ontrack.voiceproof.SignedOtaTest' --tests 'com.ontrack.voiceproof.LocalUiPageTest' --tests 'com.ontrack.voiceproof.NativeReleasePolicyTest' --tests 'com.ontrack.voiceproof.OverlayUiModelTest' --tests 'com.ontrack.voiceproof.TenantPairingContractTest' :daemon-tests:test
      - name: Assert previously-installed Android signing identity
        run: |
          set -euo pipefail
          keytool -exportcert -alias androiddebugkey -keystore "$HOME/.android/debug.keystore" -storepass android > /tmp/ontrack-expected-cert.der
          actual="$(sha256sum /tmp/ontrack-expected-cert.der | cut -d' ' -f1)"
          test "$actual" = "d25378b9c6d8486749fa64cf1f85a8a2d0b24a599588611392135f54c720ba3f" || { echo "Refusing update: cached signing identity differs from installed 0.1.6"; exit 1; }
      - name: Build installable debug APK
        working-directory: .build/jemrec
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Enable KVM access for the Android WebView smoke test
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Render actual Android WebView and exercise ready/native init
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -noaudio -no-boot-anim -gpu swiftshader_indirect -no-snapshot-save
          script: .build/jemrec/gradlew -p .build/jemrec --no-daemon :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.ontrack.voiceproof.MobileUiInstrumentedTest
      - name: Package provenance and verify signature
        run: |
          mkdir -p .build/artifact
          # Re-sign the final APK with the cached original key, regardless of Gradle or emulator debug identities.
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks "$HOME/.android/debug.keystore" \
            --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android \
            --out .build/artifact/OnTrack-Voice-0.3.5.apk \
            .build/jemrec/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs .build/artifact/OnTrack-Voice-0.3.5.apk > .build/artifact/signature.txt
          grep -Fq 'Signer #1 certificate SHA-256 digest: d25378b9c6d8486749fa64cf1f85a8a2d0b24a599588611392135f54c720ba3f' .build/artifact/signature.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose .build/artifact/OnTrack-Voice-0.3.5.apk
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest print .build/artifact/*.apk > .build/artifact/AndroidManifest.xml
          python3 tools/check_mobile_manifest.py .build/artifact/AndroidManifest.xml
          sha256sum .build/artifact/*.apk > .build/artifact/SHA256SUMS.txt
          cp .build/jemrec/ontrack-build-source.json .build/artifact/
          cp .build/jemrec/LICENSE .build/jemrec/NOTICE.md .build/artifact/
          cp -r .build/jemrec/app/build/outputs/androidTest-results .build/artifact/
      - name: Sign OTA UI with the existing Android signing identity
        run: |
          python3 tools/prepare_mobile_ota.py .build/artifact/ota
          java tools/SignMobileOta.java "$HOME/.android/debug.keystore" .build/artifact/ota
          python3 -c "import sys; sys.path.insert(0,'tools'); from queue_mobile_ota import verify; from pathlib import Path; verify(Path('.build/artifact/ota')); print('OTA signature and hashes verified')"
      - name: Prepare and sign native Android OTA update
        run: |
          python3 tools/prepare_mobile_native.py .build/artifact/OnTrack-Voice-0.3.5.apk .build/artifact/native
          java tools/SignMobileOta.java "$HOME/.android/debug.keystore" .build/artifact/native
          python3 -c "import sys;sys.path.insert(0,'tools');from queue_mobile_native import verify;from pathlib import Path;verify(Path('.build/artifact/native'));print('Signed native release metadata verified')"
      - uses: actions/upload-artifact@v5
        with:
          name: OnTrack-Voice-0.3.5
          path: .build/artifact/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: android-proof-failure-reports
          path: |
            .build/jemrec/app/build/reports/
            .build/jemrec/shellserver/tests/build/reports/
            .build/jemrec/app/build/outputs/androidTest-results/
          if-no-files-found: ignore

  publish_ota:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: OnTrack-Voice-0.3.5
          path: .build/downloaded
      - name: Queue verified OTA files through existing host worker
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/queue_mobile_ota.py .build/downloaded/ota

  publish_native:
    if: github.event_name != 'pull_request'
    needs: [build, publish_ota]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: OnTrack-Voice-0.3.5
          path: .build/downloaded
      - name: Queue signed native APK through OnTrack worker
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/queue_mobile_native.py .build/downloaded/native
