name: Build Telephony POC APK
on:
  push:
    branches: [ telephony-apk-build-temp ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: telephony-poc
        run: gradle :app:assembleDebug --stacktrace

      - name: Build release test APK
        working-directory: telephony-poc
        run: gradle :app:assembleRelease --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: OnTrack-AI-Phone-Bridge-v0.1.0
          path: |
            telephony-poc/app/build/outputs/apk/debug/app-debug.apk
            telephony-poc/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
