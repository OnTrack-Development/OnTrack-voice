name: Publish OnTrack UI OTA — no APK
# SAFETY: legacy pipeline builds a fixed old SHA; manual only until an exact-HEAD signed release replaces it.
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: ontrack-ui-only-ota
  cancel-in-progress: false
jobs:
  publish_ui:
    if: ${{ false }} # Legacy pinned UI release retired; see exact-HEAD release pipeline.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: e55445583c487c1f2698aee4043eb4575e5714f5
          persist-credentials: false
      - name: Confirm source pinned to tested owner UX revision
        run: test "$(git rev-parse HEAD)" = "e55445583c487c1f2698aee4043eb4575e5714f5"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Reuse existing Android signing identity (never generate a new key)
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: ontrack-voiceproof-debug-signing-v1
          fail-on-cache-miss: true
      - name: Validate current v0.2.9 compatibility and JavaScript
        run: python3 tools/test_mobile_ui_contract.py
      - name: Sign only HTML/CSS/JS OTA with pinned original APK certificate
        run: |
          GITHUB_SHA=e55445583c487c1f2698aee4043eb4575e5714f5 python3 tools/prepare_mobile_ota.py .build/artifact/ota
          java tools/SignMobileOta.java "$HOME/.android/debug.keystore" .build/artifact/ota
          python3 -c "import sys;sys.path.insert(0,'tools');from queue_mobile_ota import verify;from pathlib import Path;verify(Path('.build/artifact/ota'));print('SIGNED UI OTA VERIFIED')"
      - name: Upload signed UI-only artifact (no APK)
        uses: actions/upload-artifact@v5
        with:
          name: OnTrack-Voice-UI-OTA
          path: .build/artifact/
          retention-days: 30
          if-no-files-found: error
      - name: Publish signed UI through existing appontrack Cron worker
        env:
          GH_TOKEN: ${{ github.token }}
          MOBILE_OTA_ARTIFACT_NAME: OnTrack-Voice-UI-OTA
        run: python3 tools/queue_mobile_ota.py .build/artifact/ota
