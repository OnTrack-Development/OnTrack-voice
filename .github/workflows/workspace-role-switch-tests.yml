name: Platform and Reseller Workspace Switch
on:
  push:
    branches:
      - fix/workspace-admin-reseller-switch-20261102
    paths:
      - 'saas/console/_core/Bootstrap.php'
      - 'saas/console/_core/Views.php'
      - 'saas/console/_core/Actions.php'
      - 'saas/console/assets/css/app.css'
      - 'tools/test_workspace_role_switch.php'
      - '.github/workflows/workspace-role-switch-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite,pdo_mysql,mbstring,openssl,curl
          coverage: none
      - name: Syntax check
        run: |
          set -eu
          php -l saas/console/_core/Bootstrap.php
          php -l saas/console/_core/Views.php
          php -l saas/console/_core/Actions.php
          php -l tools/test_workspace_role_switch.php
      - name: Role-switch integration tests
        run: |
          set -eu
          rm -rf /tmp/ontrack-saas-demo
          php tools/test_workspace_role_switch.php
          node tools/test_console_ajax_ui.cjs
