name: WhatsApp Four Onboarding Methods
on:
  push:
    branches: [feat/wa-four-onboarding-modes-20261102]
    paths:
      - 'saas/console/**'
      - 'tools/test_whatsapp_four_onboarding.php'
      - '.github/workflows/whatsapp-four-methods-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite,pdo_mysql,mbstring,openssl,curl
          coverage: none
      - name: PHP and JS syntax
        run: |
          set -eu
          php -l saas/console/_core/Bootstrap.php
          php -l saas/console/_core/WhatsAppOnboarding.php
          php -l saas/console/_core/WhatsAppSupport.php
          php -l saas/console/_core/Views.php
          php -l saas/console/_core/Actions.php
          php -l saas/console/whatsapp-platform-webhook.php
          php -l tools/test_whatsapp_four_onboarding.php
          node --check saas/console/assets/js/app.js
      - name: Four methods, tenant isolation, Meta mock, Inbox
        run: |
          set -eu
          rm -rf /tmp/ontrack-saas-demo
          php tools/test_whatsapp_four_onboarding.php
          rm -rf /tmp/ontrack-saas-demo
          php tools/test_whatsapp_webhook_relay.php
          rm -rf /tmp/ontrack-saas-demo
          php tools/test_whatsapp_native_agent.php
