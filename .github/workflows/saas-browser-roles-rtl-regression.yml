name: SaaS real Chromium roles/responsive + AJAX (ISOLATED, NO DEPLOY)
on:
  push:
    branches:
      - fix/saas-integrated-phases123-20261109
    paths:
      - 'saas/console/**'
      - 'tools/audit_saas_responsive.cjs'
      - 'tools/seed_responsive_ui.php'
      - 'tools/test_saas_ui_router.php'
      - '.github/workflows/saas-browser-roles-rtl-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium-role-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      CI: 'true'
      SAAS_RESPONSIVE_FIXTURE: '1'
      ONTRACK_CI_NAMESPACE: ui_${{ github.run_id }}_${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite,mbstring,openssl,curl,sodium,dom
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify disposable browser, PHP and fixture guard
        shell: bash
        run: |
          set -euo pipefail
          php -l tools/seed_responsive_ui.php
          php -l tools/test_saas_ui_router.php
          php -l tools/check_saas_roles_form_post_http.php
          python3 -m py_compile tools/test_saas_roles_form_post_http.py
          node --check tools/audit_saas_responsive.cjs
          command -v php
          command -v node
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [[ -z "$chrome" ]]; then echo 'No real Chrome/Chromium browser present - cannot claim UI E2E'; exit 41; fi
          echo "CHROME_BIN=$chrome" >> "$GITHUB_ENV"
          "$chrome" --version
      - name: Seed isolated demo user fixture (never use actual database)
        run: |
          set -euo pipefail
          php tools/seed_responsive_ui.php
      - name: Real browser / three roles / 237 responsive layouts / AJAX + theme + drawer
        shell: bash
        run: |
          set -euo pipefail
          php -S 127.0.0.1:18773 -t saas/console tools/test_saas_ui_router.php > /tmp/ontrack-ui-server.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:18773/login -o /tmp/ontrack-ui-login; then break; fi
            if ! kill -0 "$server" 2>/dev/null; then cat /tmp/ontrack-ui-server.log; exit 44; fi
            sleep 0.15
          done
          test -s /tmp/ontrack-ui-login
          node tools/audit_saas_responsive.cjs || {
            echo 'CHROME_ROLE_AUDIT_FAILED; PHP router tail (sanitize before external sharing)'
            tail -n 40 /tmp/ontrack-ui-server.log
            exit 1
          }
          echo 'SAAS_REAL_CHROMIUM_ADMIN_RESELLER_CUSTOMER_BROWSER_PASS'
          python3 tools/test_saas_roles_form_post_http.py
          php tools/check_saas_roles_form_post_http.php
          echo 'SAAS_REAL_BROWSER_AND_HTTP_FORMS_PERSISTED_PASS'
      - name: Assert no deployed code, mobile APK, keys or production state changed
        run: |
          echo 'SAAS_BROWSER_CI_DISPOSABLE_SQLITE_AND_NO_DEPLOY_PASS'
