name: OnTrack Voice SaaS PHP Console
on:
  push:
    branches: [main, voice-saas-console-staging, voice-saas-rework, 'fix/voice-internal-staging-20261102', 'fix/console-pricing-connection-ui-20261102', 'fix/sim1-staging-ui-20261102', 'feat/tenant-only-mobile-workspace-20261102', 'fix/tenant-mix-session-parity-20261102', 'fix/flow-editor-ai-20261102','feat/voice-production-gap-20261103', 'feat/web-auth-complete-20261105']
    paths:
      - 'saas/console/**'
      - 'tools/test_voice_saas_console.php'
      - 'tools/test_tenant_workspace.php'
      - 'tools/test_tenant_voice_transcript_archive.php'
      - 'tools/test_tenant_call_ai_summary.php'
      - 'tools/test_console_pricing_ui.php'
      - 'tools/test_flow_ai_sources.php'
      - 'tools/test_floating_flow_ui.cjs'
      - 'tools/test_console_ajax_ui.cjs'
      - 'tools/test_flow_ai_chat.php'
      - 'tools/test_dynamic_agent_studio.php'
      - 'tools/test_ai_agent_profile.php'
      - 'tools/test_flow_ai_stress.php'
      - 'tools/test_graph_routing.cjs'
      - 'tools/test_whatsapp_inbox.php'
      - 'tools/test_whatsapp_whmcs_bridge.php'
      - '.github/workflows/voice-saas-console.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: PHP 8.3 and database extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite,mbstring,pdo_mysql,openssl,fileinfo
          coverage: none
      - name: PHP syntax for all runtime source files
        run: |
          set -eu
          find saas/console -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          php -l tools/test_voice_saas_console.php
          php -l tools/test_tenant_device_pairing.php
          php -l tools/test_admin_mfa.php
          php tools/test_admin_mfa.php
          php -l tools/test_console_kashier_webhook.php
          php tools/test_console_kashier_webhook.php
          php -l tools/test_voice_sso.php
      - name: Validate JavaScript and local QR rendering
        run: |
          node --check saas/console/assets/js/app.js
          node --check saas/console/assets/js/flow-graph.js
          node --check saas/console/assets/js/graph-routing.js
          node --check saas/console/assets/js/pairing-qr.js
          node --check saas/console/assets/js/mfa-qr.js
          node tools/test_voice_qr.cjs
          node tools/test_floating_flow_ui.cjs
          node tools/test_graph_routing.cjs
          node tools/test_console_ajax_ui.cjs
          php tools/test_flow_templates.php
          php tools/test_answer_policy.php
          php tools/test_google_provider_config.php
          php tools/test_voice_trial_and_ui.php
      - name: Database, roles, demo users, branding and isolation smoke
        run: php tools/test_voice_saas_console.php
      - name: Additional pricing, mobile keyless UX and migration regressions
        run: php tools/test_console_pricing_ui.php
      - name: Tenant workspace isolation and call history
        run: php tools/test_tenant_workspace.php
      - name: Per-SIM transcript, manual takeover and AI summary regression
        run: |
          php tools/test_tenant_voice_transcript_archive.php
          php tools/test_tenant_call_ai_summary.php
      - name: AI flow knowledge, connector security, tenant isolation and RBAC
        run: php tools/test_flow_ai_sources.php
      - name: Persistent AI chat history, explanation and account/user isolation
        run: php tools/test_flow_ai_chat.php
      - name: External SSO regression in isolated second test phase
        run: |
          php tools/test_voice_sso.php
          python3 tools/test_voice_sso_http.py
      - name: Dynamic Agent Studio published session and no-scenarios regression
        run: php tools/test_dynamic_agent_studio.php
      - name: Visual builder AI profile proposal and durable per-agent memory
        run: php tools/test_ai_agent_profile.php
      - name: Extreme AI graph quality, safe exits and no shallow-tree regression
        run: php tools/test_flow_ai_stress.php
      - name: Official Meta WhatsApp webhook, Inbox and human takeover
        run: php tools/test_whatsapp_inbox.php
      - name: WHMCS AI Support Agent channel bridge reviewer and human takeover regression
        run: php tools/test_whatsapp_whmcs_bridge.php
