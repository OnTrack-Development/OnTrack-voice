name: Deploy OnTrack Voice Root SaaS
on:
  push:
    branches: [main, 'feat/voice-production-gap-20261103']
    paths:
      - 'saas/console/**'
      - 'tools/deploy_saas_console.py'
      - 'tools/queue_saas_console.py'
      - 'tools/test_flow_ai_transport.php'
      - 'tools/test_flow_ai_live_thinking.php'
      - 'tools/test_flow_ai_live_text_editor.php'
      - 'tools/test_flow_ai_async_jobs.php'
      - 'tools/test_flow_ai_chat.php'
      - 'tools/test_ai_relay.php'
      - 'tools/test_console_pricing_ui.php'
      - 'tools/test_tenant_workspace.php'
      - 'tools/test_voice_sso.php'
      - 'tools/test_voice_sso_http.py'
      - 'tools/test_whatsapp_whmcs_bridge.php'
      - 'tools/test_voice_saas_console.php'
      - 'tools/test_tenant_account_bridge.php'
      - 'tools/test_tenant_device_pairing.php'
      - 'tools/test_tenant_call_ai_summary.php'
      - 'tools/test_sim_agent_call_reports.php'
      - 'tools/test_android_v58_permission_contract.py'
      - 'tools/test_fish_voice_catalog_cache.php'
      - 'tools/test_voice_picker_and_persona.cjs'
      - '.github/workflows/voice-saas-publish.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ontrack-root-release-${{ github.ref }}
  cancel-in-progress: false
env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: 'utf-8'
jobs:
  check:
    runs-on: [self-hosted, Windows, X64, ontrack-signing-recovery]
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Syntax and full console/bridge/billing regression
        run: |
          $ErrorActionPreference = 'Stop'
          $env:CI = 'true'
          Get-ChildItem 'saas\console' -Recurse -Filter '*.php' | ForEach-Object {
            & php -l $_.FullName | Out-Null
            if ($LASTEXITCODE -ne 0) { throw ('PHP lint failed: ' + $_.FullName) }
          }
          $checks = @(
            @('php', 'tools/test_flow_ai_transport.php'),
            @('php', 'tools/test_voice_saas_console.php'),
            @('php', 'tools/test_tenant_account_bridge.php'),
            @('php', 'tools/test_six_digit_sim_pairing.php'),
            @('php', 'tools/test_reseller_parent_service_gate_v70.php'),
            @('php', 'tools/test_sim_agent_call_reports.php'),
            @('php', 'tools/test_tenant_call_ai_summary.php'),
            @('python', 'tools/test_mobile_ui_contract.py'),
            @('python', 'tools/test_v1_mobile_shell.py'),
            @('python', 'tools/test_android_v58_permission_contract.py'),
            @('php', 'tools/test_flow_ai_chat.php'),
            @('php', 'tools/test_ai_relay.php'),
            @('php', 'tools/test_admin_mfa.php'),
            @('php', 'tools/test_console_kashier_webhook.php'),
            @('php', 'tools/test_console_pricing_ui.php'),
            @('php', 'tools/test_tenant_workspace.php'),
            @('php', 'tools/test_tenant_voice_transcript_archive.php'),
            @('php', 'tools/test_flow_ai_sources.php'),
            @('php', 'tools/test_dynamic_agent_studio.php'),
            @('php', 'tools/test_flow_ai_stress.php'),
            @('php', 'tools/test_whatsapp_inbox.php'),
            @('php', 'tools/test_whatsapp_whmcs_bridge.php'),
            @('php', 'tools/test_voice_trial_and_ui.php'),
            @('php', 'tools/test_flow_templates.php'),
            @('php', 'tools/test_answer_policy.php'),
            @('php', 'tools/test_google_provider_config.php'),
            @('php', 'tools/test_voice_sso.php'),
            @('python', 'tools/test_voice_sso_http.py'),
            @('node', 'tools/test_voice_qr.cjs'),
            @('node', 'tools/test_floating_flow_ui.cjs'),
            @('node', 'tools/test_graph_routing.cjs'),
            @('node', 'tools/test_console_ajax_ui.cjs'),
            @('node', 'tools/test_voice_picker_and_persona.cjs'),
            @('php', 'tools/test_io_premium_shared_access.php'),
            @('php', 'tools/test_fish_voice_catalog_cache.php'),
            @('php', 'tools/test_ai_agent_profile.php'),
            @('php', 'tools/test_flow_ai_live_thinking.php'),
            @('php', 'tools/test_flow_ai_live_text_editor.php'),
            @('php', 'tools/test_flow_ai_async_jobs.php')
          )
          $i = 0
          foreach ($c in $checks) {
            $i++
            $env:ONTRACK_CI_NAMESPACE = "saaspub-$env:GITHUB_RUN_ID-$i"
            Write-Host ">>> [$i/$($checks.Count)] $($c[0]) $($c[1])"
            & $c[0] $c[1]
            if ($LASTEXITCODE -ne 0) { throw ('Failed: ' + $c[1]) }
          }
          & node --check saas/console/assets/js/flow-graph.js
          if ($LASTEXITCODE -ne 0) { throw 'flow-graph.js syntax failed' }
          & node --check saas/console/assets/js/app.js
          if ($LASTEXITCODE -ne 0) { throw 'app.js syntax failed' }
          & python -m py_compile tools/deploy_saas_console.py tools/queue_saas_console.py
          if ($LASTEXITCODE -ne 0) { throw 'Python deployer syntax failed' }
  publish:
    if: github.event_name == 'workflow_dispatch'
    needs: check
    runs-on: [self-hosted, Windows, X64, ontrack-signing-recovery]
    timeout-minutes: 12
    defaults:
      run:
        shell: pwsh
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Package pinned console runtime only
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -Path 'dist\saas-console' -ItemType Directory -Force | Out-Null
          & python -c "import hashlib, pathlib, tarfile; out=pathlib.Path('dist/saas-console/release.tar.gz'); src=pathlib.Path('saas/console'); tf=tarfile.open(out,'w:gz',format=tarfile.USTAR_FORMAT); [tf.add(p, arcname='console/'+p.relative_to(src).as_posix()) for p in sorted(src.rglob('*'))]; tf.close(); pathlib.Path('dist/saas-console/release.sha256').write_text(hashlib.sha256(out.read_bytes()).hexdigest()+'\n')"
          if ($LASTEXITCODE -ne 0) { throw 'Packaging console bundle failed' }
      - name: Upload immutable console bundle
        uses: actions/upload-artifact@v4
        with:
          name: OnTrack-SaaS-Console
          path: dist/saas-console/
          retention-days: 14
          if-no-files-found: error
      - name: Queue safe deployment on existing host Cron worker (manual dispatch only)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/queue_saas_console.py
