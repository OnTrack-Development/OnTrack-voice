name: Release verified OnTrack Voice 0.3.8 to the installed app
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-verified-mobile.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: ontrack-verified-mobile-release
  cancel-in-progress: false
jobs:
  await_signed_build:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - name: Require successful pinned Android + emulator CI before any publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,os,time,urllib.request
          repo="OnTrack-Development/OnTrack-voice"
          source_run=41384823769
          source_sha="1dc662b19b9c6d1782a4c54e5ad39fa86fffb64a"
          url=f"https://api.github.com/repos/{repo}/actions/runs/{source_run}"
          for attempt in range(75):
              req=urllib.request.Request(url,headers={
                  "Authorization":"Bearer "+os.environ["GH_TOKEN"],
                  "Accept":"application/vnd.github+json",
                  "User-Agent":"OnTrack-Pinned-Release-Gate"})
              with urllib.request.urlopen(req,timeout=15) as response:
                  run=json.load(response)
              assert run["head_sha"]==source_sha, "Wrong APK source SHA"
              assert run["event"]=="push" and run["head_branch"]=="fix/tenant-mix-session-parity-20261102", "Wrong release source event/branch"
              if run["status"]=="completed":
                  assert run["conclusion"]=="success", "Pinned Android CI did not pass"
                  print("PINNED_ANDROID_BUILD_PASSED",source_run,source_sha)
                  break
              print("Waiting for pinned signed Android build",source_run,attempt+1,flush=True)
              time.sleep(20)
          else:
              raise RuntimeError("Pinned Android CI timeout; release blocked")
          PY

  publish_ota:
    needs: await_signed_build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 1dc662b19b9c6d1782a4c54e5ad39fa86fffb64a
          persist-credentials: false
      - uses: actions/download-artifact@v5
        with:
          name: OnTrack-Voice-0.3.8
          repository: OnTrack-Development/OnTrack-voice
          run-id: 41384823769
          github-token: ${{ github.token }}
          path: .build/downloaded
      - name: Verify signed revision 26 / native version 29 before host queue
        run: |
          python3 -m py_compile tools/queue_mobile_ota.py tools/queue_mobile_native.py saas/mobile/ota/deploy.py saas/mobile/ota/native_deploy.py
          python3 tools/test_mobile_release_gate.py
          python3 tools/test_mobile_ui_contract.py
          python3 - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0,"tools")
          from queue_mobile_ota import verify as verify_ui
          from queue_mobile_native import verify as verify_native
          _,_,ui=verify_ui(Path(".build/downloaded/ota"))
          _,_,apk=verify_native(Path(".build/downloaded/native"))
          assert ui["revision"]==26 and ui["max_native"]>=29
          assert apk["version_code"]==29 and apk["version_name"]=="0.3.8-ota"
          print("SIGNED_OTA_26_AND_NATIVE_29_VERIFIED")
          PY
      - name: Verify SaaS workspace was deployed and acknowledged on the same host
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,os,base64,urllib.request
          repo="OnTrack-Development/OnTrack-voice"
          url=f"https://api.github.com/repos/{repo}/contents/ops/host-link/results/appontrack-server11/saas-console-41384996320.json?ref=ontrack-host-link"
          req=urllib.request.Request(url,headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json"})
          with urllib.request.urlopen(req,timeout=20) as resp:
              file=json.load(resp)
          data=json.loads(base64.b64decode(file["content"]))
          receipt=json.loads(data["stdout"])
          assert data["job_id"]=="saas-console-41384996320" and data["status"]=="success" and data["exit_code"]==0
          assert receipt.get("result")=="deployed" and receipt.get("source")=="1dc662b19b9c"
          assert receipt.get("target")=="/saas/console/" and receipt.get("backup") is True
          print("SaaS_TENANT_WORKSPACE_HOST_DEPLOYMENT_VERIFIED")
          PY
      - name: Queue signed OTA 26 from the verified Android 0.3.8 artifact
        env:
          GH_TOKEN: ${{ github.token }}
          MOBILE_RELEASE_SOURCE_RUN_ID: '41384823769'
          MOBILE_OTA_ARTIFACT_NAME: OnTrack-Voice-0.3.8
        run: python3 tools/queue_mobile_ota.py .build/downloaded/ota

  publish_native:
    needs: publish_ota
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 1dc662b19b9c6d1782a4c54e5ad39fa86fffb64a
          persist-credentials: false
      - uses: actions/download-artifact@v5
        with:
          name: OnTrack-Voice-0.3.8
          repository: OnTrack-Development/OnTrack-voice
          run-id: 41384823769
          github-token: ${{ github.token }}
          path: .build/downloaded
      - name: Wait for exact OTA 26 installation receipt before queuing signed native 29
        env:
          GH_TOKEN: ${{ github.token }}
          MOBILE_RELEASE_SOURCE_RUN_ID: '41384823769'
        run: python3 tools/queue_mobile_native.py .build/downloaded/native
      - name: Verify native 29 installation acknowledgement on real host
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,sys,os
          sys.path.insert(0,"tools")
          from queue_mobile_native import wait_queue
          _,task,report=wait_queue()
          assert task["id"]=="mobile-native-"+os.environ["GITHUB_RUN_ID"],"Wrong native job"
          assert report.get("status")=="success" and report.get("exit_code")==0,"Native host failed"
          output=json.loads(report["stdout"])
          assert output.get("status")=="published" and output.get("version")==29,"Host did not publish Android 28"
          print("NATIVE_29_HOST_PUBLISHED_VERIFIED")
          PY
