name: Signed OnTrack Voice Call Reports OTA
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-call-reports-verified
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 59007a4ef00fe68738ee32a699e00f9e133d336b
      - uses: actions/checkout@v5
        with:
          repository: jemcik/JemRec
          ref: f011062adfb3a2154c4d5a9cc4394032fb4345f2
          path: .build/jemrec
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: ontrack-voiceproof-debug-signing-v1
      - uses: android-actions/setup-android@v4
      - name: Install pinned Android platforms
        run: |
          sdkmanager --install "platforms;android-37" || sdkmanager --install "platforms;android-37.0"
          sdkmanager --install "platforms;android-36" || sdkmanager --install "platforms;android-36.0"
          sdkmanager --install "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply verified OnTrack source overlay
        run: python3 saas/mobile/audio-proof/prepare.py .build/jemrec
      - name: Verify Android native/UI release contract
        run: python3 tools/test_native_039_contract.py
      - name: Build and run project-specific tests
        working-directory: .build/jemrec
        run: |
          ./gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest \
            --tests 'com.ontrack.voiceproof.LinkPcmTest' \
            --tests 'com.ontrack.voiceproof.TenantAgentIdentityTest' \
            --tests 'com.ontrack.voiceproof.TenantPairingContractTest' \
            --tests 'com.ontrack.voiceproof.TenantEngineRestorePolicyTest' \
            --tests 'com.ontrack.voiceproof.NativeReleasePolicyTest' \
            --tests 'com.ontrack.voiceproof.SignedOtaTest'
      - name: Fail closed if signing key differs from installed application
        run: |
          set -euo pipefail
          keytool -exportcert -alias androiddebugkey -keystore "$HOME/.android/debug.keystore" -storepass android > /tmp/ontrack-cert.der
          actual="$(sha256sum /tmp/ontrack-cert.der | cut -d' ' -f1)"
          test "$actual" = "d25378b9c6d8486749fa64cf1f85a8a2d0b24a599588611392135f54c720ba3f" || {
            echo "Signing identity mismatch. No OTA release will be queued."; exit 1;
          }
      - name: Sign, validate and package native Android OTA
        run: |
          set -euo pipefail
          mkdir -p .build/artifact
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks "$HOME/.android/debug.keystore" --ks-key-alias androiddebugkey \
            --ks-pass pass:android --key-pass pass:android \
            --out .build/artifact/OnTrack-Voice-0.3.9.apk \
            .build/jemrec/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs .build/artifact/OnTrack-Voice-0.3.9.apk > .build/artifact/signature.txt
          grep -Fq 'Signer #1 certificate SHA-256 digest: d25378b9c6d8486749fa64cf1f85a8a2d0b24a599588611392135f54c720ba3f' .build/artifact/signature.txt
          python3 tools/prepare_mobile_native.py .build/artifact/OnTrack-Voice-0.3.9.apk .build/artifact/native
          java tools/SignMobileOta.java "$HOME/.android/debug.keystore" .build/artifact/native
          python3 -c "import sys;sys.path.insert(0,'tools');from queue_mobile_native import verify;from pathlib import Path;verify(Path('.build/artifact/native'));print('Native OTA signature validated')"
      - name: Sign required matching UI OTA manifest
        env:
          GITHUB_SHA: 59007a4ef00fe68738ee32a699e00f9e133d336b
        run: |
          set -euo pipefail
          python3 tools/prepare_mobile_ota.py .build/artifact/ota
          java tools/SignMobileOta.java "$HOME/.android/debug.keystore" .build/artifact/ota
          python3 -c "import sys;sys.path.insert(0,'tools');from queue_mobile_ota import verify;from pathlib import Path;verify(Path('.build/artifact/ota'));print('UI OTA signature validated')"
      - uses: actions/upload-artifact@v5
        with:
          name: OnTrack-Voice-0.3.9
          path: |
            .build/artifact/OnTrack-Voice-0.3.9.apk
            .build/artifact/signature.txt
            .build/artifact/native/
            .build/artifact/ota/
          if-no-files-found: error
  publish_ui:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 59007a4ef00fe68738ee32a699e00f9e133d336b
      - uses: actions/download-artifact@v5
        with:
          name: OnTrack-Voice-0.3.9
          path: .build/artifact
      - name: Publish verified UI release and queue host acknowledgement
        env:
          GH_TOKEN: ${{ github.token }}
          MOBILE_OTA_ARTIFACT_NAME: OnTrack-Voice-0.3.9
        run: python3 tools/queue_mobile_ota.py .build/artifact/ota
  publish_native:
    needs: [build, publish_ui]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 59007a4ef00fe68738ee32a699e00f9e133d336b
      - uses: actions/download-artifact@v5
        with:
          name: OnTrack-Voice-0.3.9
          path: .build/artifact
      - name: Publish native APK only after exact signed UI host receipt
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/queue_mobile_native.py .build/artifact/native
