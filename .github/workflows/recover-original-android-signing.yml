# One-time owner-only recovery on the owner's Windows 11 machine.
# No GitHub-hosted runner, APK publication, or artifact upload.
name: Recover original Android signing key (local Windows only)
run-name: Owner-only signing recovery
on:
  workflow_dispatch:
  push:
    branches:
      - feat/voice-production-gap-20261103
    paths:
      - .github/workflows/recover-original-android-signing.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: ontrack-owner-key-recovery
  cancel-in-progress: false

jobs:
  recover:
    if: github.actor == 'ahmedbedir'
    runs-on: [self-hosted, Windows, X64, ontrack-signing-recovery]
    timeout-minutes: 10
    steps:
      - name: Confirm local GNU tar and zstd support
        shell: powershell
        run: |
          $gnuTar = "C:\Program Files\Git\usr\bin"
          if (-not (Test-Path (Join-Path $gnuTar 'tar.exe'))) {
            throw "GNU tar missing. Install Git for Windows and retry."
          }
          $gnuTar | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          if (-not (Get-Command zstd.exe -ErrorAction SilentlyContinue)) {
            $gitZstd = Join-Path $gnuTar 'zstd.exe'
            if (-not (Test-Path $gitZstd)) {
              throw "zstd missing. Install zstd for Windows, place it on PATH, and retry."
            }
          }
      - name: Restore original signing identity from existing GitHub Actions cache
        id: restored
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: ontrack-voiceproof-debug-signing-v1
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - name: Find recovered Linux cache entry and verify its signing certificate
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = 'd25378b9c6d8486749fa64cf1f85a8a2d0b24a599588611392135f54c720ba3f'
          $destination = Join-Path $env:USERPROFILE '.android\debug.keystore'
          # Search only on the owner's workstation, for one file name.
          # Do not transmit the private file, its contents, or its hash.
          $roots = @(
            (Join-Path $env:USERPROFILE '.android'),
            $env:USERPROFILE,
            $env:GITHUB_WORKSPACE,
            (Join-Path $env:RUNNER_WORKSPACE '..'),
            'C:\home',
            'D:\home',
            'C:\Program Files\Git',
            'D:\ai',
            'C:\Users'
          ) | Where-Object { $_ -and (Test-Path -LiteralPath $_) } |
            Sort-Object -Unique
          $found = @()
          foreach ($root in $roots) {
            $files = @(Get-ChildItem -LiteralPath $root -Filter 'debug.keystore' -File -Force -Recurse -ErrorAction SilentlyContinue)
            $found += $files
          }
          $found = @($found | Sort-Object FullName -Unique)
          if ($found.Count -eq 0) {
            Write-Host 'KEYSTORE_SEARCH_RESULT: NOT_FOUND'
            Write-Host 'The archive restore says success, but no debug.keystore is present in the searched local roots.'
            throw 'No signing key was found. The existing Android installation is unaffected.'
          }
          Write-Host ('KEYSTORE_CANDIDATES_LOCAL: ' + $found.Count)
          $certificate = Join-Path $env:RUNNER_TEMP 'ontrack-signing-verify.der'
          $matched = $null
          try {
            foreach ($candidate in $found) {
              Remove-Item -LiteralPath $certificate -Force -ErrorAction SilentlyContinue
              & keytool -exportcert -alias androiddebugkey -keystore $candidate.FullName -storepass android -file $certificate 2>$null | Out-Null
              if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $certificate)) { continue }
              $fingerprint = (Get-FileHash -LiteralPath $certificate -Algorithm SHA256).Hash.ToLowerInvariant()
              if ($fingerprint -eq $expected) {
                $matched = $candidate.FullName
                break
              }
            }
          } finally {
            Remove-Item -LiteralPath $certificate -Force -ErrorAction SilentlyContinue
          }
          if (-not $matched) {
            throw 'Restored file(s) did not match the existing APK signing certificate. Refusing key replacement.'
          }
          if ($matched -ne $destination) {
            if (Test-Path -LiteralPath $destination) {
              throw 'Destination keystore already exists. Refusing overwrite.'
            }
            New-Item -ItemType Directory -Path (Split-Path $destination -Parent) -Force | Out-Null
            Copy-Item -LiteralPath $matched -Destination $destination
          }
          Write-Host 'SIGNING_IDENTITY_VERIFIED: PASS'
          Write-Host 'Original Android signing key verified and available on the local workstation.'
