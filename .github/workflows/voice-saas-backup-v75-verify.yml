name: OnTrack v75 protected live SQLite backup and isolated restore drill
on:
  push:
    branches: [feat/io-premium-native-v51-20261107]
    paths:
      - '.github/workflows/voice-saas-backup-v75-verify.yml'
      - 'tools/host_v75_sqlite_backup_restore.py'
      - 'tools/test_v75_sqlite_backup_restore.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ontrack-saas-v75-private-restore-drill
  cancel-in-progress: false
jobs:
  verify:
    name: Validate online snapshot and restore a private copy without touching live DB
    runs-on: [self-hosted, Windows, X64, ontrack-signing-recovery]
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Isolated SQLite online backup and restore regression
        run: |
          $ErrorActionPreference='Stop'
          & python -m py_compile tools/host_v75_sqlite_backup_restore.py tools/test_v75_sqlite_backup_restore.py
          if($LASTEXITCODE -ne 0){throw 'Backup/restore script syntax invalid'}
          & python tools/test_v75_sqlite_backup_restore.py
          if($LASTEXITCODE -ne 0){throw 'Isolated DB restore regression failed'}
          Write-Host 'V75_PRIVATE_BACKUP_RESTORE_REGRESSION_PASS'
      - name: Stage backup tool into authorized host private directory
        run: |
          $ErrorActionPreference='Stop'
          $key=Join-Path $env:USERPROFILE '.ssh\ontrack_publish_ed25519'
          if(!(Test-Path -LiteralPath $key)){throw 'Approved SSH key unavailable'}
          $ssh=@('-i',$key,'-o','BatchMode=yes','-o','IdentitiesOnly=yes','-o','StrictHostKeyChecking=yes','-o','ConnectTimeout=12')
          $remote='appontrack@65.21.208.232'
          $stage='/home/appontrack/.ontrack-mobile/saas-backup-drill-v75'
          & ssh.exe @ssh -p 7195 $remote ('umask 077; mkdir -p '+$stage+'; chmod 700 '+$stage)
          if($LASTEXITCODE -ne 0){throw 'Private backup staging unavailable'}
          & scp.exe @ssh -P 7195 tools/host_v75_sqlite_backup_restore.py ($remote+':'+$stage+'/backup.py')
          if($LASTEXITCODE -ne 0){throw 'Private backup tool transfer failed'}
          Write-Host 'V75_AUTHORIZED_PRIVATE_BACKUP_TOOL_STAGED_PASS'
      - name: Take live-consistent snapshot and verify isolated restore on the host
        run: |
          $ErrorActionPreference='Stop'
          $key=Join-Path $env:USERPROFILE '.ssh\ontrack_publish_ed25519'
          $ssh=@('-i',$key,'-o','BatchMode=yes','-o','IdentitiesOnly=yes','-o','StrictHostKeyChecking=yes','-o','ConnectTimeout=12')
          $remote='appontrack@65.21.208.232'
          & ssh.exe @ssh -p 7195 $remote 'python3 /home/appontrack/.ontrack-mobile/saas-backup-drill-v75/backup.py'
          if($LASTEXITCODE -ne 0){throw 'Real private SQLite backup or isolated restore drill failed'}
          Write-Host 'V75_LIVE_PRIVATE_BACKUP_WITH_ISOLATED_RESTORE_PROVEN_PASS'
