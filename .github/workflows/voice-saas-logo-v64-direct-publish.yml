name: OnTrack v64 wide logo and multipart-free direct publish
on:
  push:
    branches: [feat/io-premium-native-v51-20261107]
    paths:
      - '.github/workflows/voice-saas-logo-v64-direct-publish.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ontrack-saas-logo-v64-direct
  cancel-in-progress: false
jobs:
  verify-publish:
    runs-on: [self-hosted, Windows, X64, ontrack-signing-recovery]
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Windows runner validates isolated media; production publisher patches only scoped login-brand HTML.
      - name: Syntax and isolated billing, account and branding tests
        run: |
          $ErrorActionPreference='Stop'
          & python -m py_compile tools/deploy_saas_brand_v64.py tools/test_brand_css_v64.py
          if($LASTEXITCODE -ne 0){throw 'Brand deploy or CSS test script invalid'}
          & python tools/test_brand_css_v64.py
          if($LASTEXITCODE -ne 0){throw 'Wide logo CSS test failed'}
          & node --check saas/console/assets/js/app.js
          if($LASTEXITCODE -ne 0){throw 'Logo upload JS invalid'}
          foreach($php in @(
             'saas/console/_core/BrandIdentity.php','saas/console/_core/Bootstrap.php',
             'saas/console/_core/Actions.php','saas/console/_core/Views.php',
             'saas/console/_core/WhiteLabel.php','saas/console/index.php'
          )){
             & php -l $php
             if($LASTEXITCODE -ne 0){throw ('Logo PHP parse failed '+$php)}
          }
          $n=0
          foreach($test in @(
             'tools/test_brand_identity_v64.php','tools/test_console_theme_v63.php',
             'tools/test_console_typography_v62.php','tools/test_customer_accounts_v59.php',
             'tools/test_invoice_billing_v58.php'
          )){
             $n++
             $env:ONTRACK_CI_NAMESPACE='brand64_'+$env:GITHUB_RUN_ID+'_'+$n
             & php $test
             if($LASTEXITCODE -ne 0){throw ('Brand or tenant isolation failed '+$test)}
          }
          Remove-Item Env:\ONTRACK_CI_NAMESPACE -ErrorAction SilentlyContinue
          Write-Host 'BRAND_V64_ALL_ISOLATED_TESTS_PASS'
      - name: Stage private logo module and seven updated files via authorized SSH
        run: |
          $ErrorActionPreference='Stop'
          $key=Join-Path $env:USERPROFILE '.ssh\ontrack_publish_ed25519'
          if(!(Test-Path -LiteralPath $key)){throw 'Authorized deploy identity unavailable'}
          $ssh=@('-i',$key,'-o','BatchMode=yes','-o','IdentitiesOnly=yes','-o','StrictHostKeyChecking=yes','-o','ConnectTimeout=12')
          $remote='appontrack@65.21.208.232'
          $stage='/home/appontrack/.ontrack-mobile/saas-brand-v64'
          & ssh.exe @ssh -p 7195 $remote ('umask 077; mkdir -p '+$stage+'/new/_core '+$stage+'/new/assets/css '+$stage+'/new/assets/js; chmod 700 '+$stage)
          if($LASTEXITCODE -ne 0){throw 'Brand staging directory failed'}
          foreach($file in @('BrandIdentity.php','Bootstrap.php','Actions.php','Views.php','WhiteLabel.php')){
            & scp.exe @ssh -P 7195 ('saas/console/_core/'+$file) ($remote+':'+$stage+'/new/_core/'+$file)
            if($LASTEXITCODE -ne 0){throw ('Brand PHP staging failed '+$file)}
          }
          & scp.exe @ssh -P 7195 saas/console/index.php ($remote+':'+$stage+'/new/index.php')
          if($LASTEXITCODE -ne 0){throw 'Brand route staging failed'}
          & scp.exe @ssh -P 7195 saas/console/assets/css/app.css ($remote+':'+$stage+'/new/assets/css/app.css')
          if($LASTEXITCODE -ne 0){throw 'Brand CSS staging failed'}
          & scp.exe @ssh -P 7195 saas/console/assets/js/app.js ($remote+':'+$stage+'/new/assets/js/app.js')
          if($LASTEXITCODE -ne 0){throw 'Brand JS staging failed'}
          & scp.exe @ssh -P 7195 tools/deploy_saas_brand_v64.py ($remote+':'+$stage+'/deploy.py')
          if($LASTEXITCODE -ne 0){throw 'Brand SSH publisher staging failed'}
          Write-Host 'BRAND_V64_DIRECT_SSH_STAGE_PASS'
      # Canonical root upload and authenticated /brand-logo image path both use real PHP endpoints.
      - name: Publish live and verify server, public CSS/JS and raw upload route
        run: |
          $ErrorActionPreference='Stop'
          $key=Join-Path $env:USERPROFILE '.ssh\ontrack_publish_ed25519'
          $ssh=@('-i',$key,'-o','BatchMode=yes','-o','IdentitiesOnly=yes','-o','StrictHostKeyChecking=yes','-o','ConnectTimeout=12')
          $remote='appontrack@65.21.208.232'
          & ssh.exe @ssh -p 7195 $remote 'python3 /home/appontrack/.ontrack-mobile/saas-brand-v64/deploy.py'
          if($LASTEXITCODE -ne 0){throw 'Production brand deployment failed (rollback expected)'}
          $url='https://app.ontrackegy.com/saas/console/assets/css/app.css?v=64-'+$env:GITHUB_RUN_ID
          $css=Invoke-WebRequest -Uri $url -TimeoutSec 40 -MaximumRedirection 1 -SkipHttpErrorCheck
          if([int]$css.StatusCode -ne 200 -or
             -not $css.Content.Contains('OTV_BRAND_LOGO_V64_BEGIN')){
             throw 'Public wide logo CSS is not active'
          }
          $js=Invoke-WebRequest -Uri ('https://app.ontrackegy.com/saas/console/assets/js/app.js?v=64-'+$env:GITHUB_RUN_ID) -TimeoutSec 40 -MaximumRedirection 1 -SkipHttpErrorCheck
          if([int]$js.StatusCode -ne 200 -or
             -not $js.Content.Contains("fetch('/?ot_brand_upload=1'")){
             throw 'Public raw binary logo uploader is not active'
          }
          $data=[byte[]](0x89,0x50,0x4e,0x47,0x0d,0x0a,0x1a,0x0a)
          $probe=Invoke-WebRequest -Uri 'https://app.ontrackegy.com/?ot_brand_upload=1' -Method Post -Body $data -ContentType 'image/png' -TimeoutSec 30 -MaximumRedirection 0 -SkipHttpErrorCheck
          if([int]$probe.StatusCode -eq 403){throw 'Raw logo route is still blocked by host WAF 403'}
          if([int]$probe.StatusCode -ne 401){throw ('Unauthenticated upload did not return safe 401: HTTP '+$probe.StatusCode)}
          Write-Host ('BRAND_V64_CANONICAL_ROOT_RAW_PROBE_HTTP '+$probe.StatusCode)
          Write-Host 'BRAND_V64_LIVE_CSS_JS_AND_UNAUTH_WAF_PROBE_PASS'
