name: Deploy Lebanese feedback scenario to canonical root
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/voice-lebanese-feedback-live-deploy.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: voice-lebanese-feedback-canonical-root
  cancel-in-progress: false
jobs:
  deploy:
    name: Publish and verify Lebanese feedback scenario over direct SSH
    runs-on: [self-hosted, Windows, X64, ontrack-signing-recovery]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/voice-v1-20261106
          persist-credentials: false
      - name: Validate scenario files locally on existing Windows runner
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          & node --check saas/console/assets/js/app.js
          if($LASTEXITCODE -ne 0){throw 'Agent Studio JavaScript syntax failed'}
          & python -m py_compile tools/patch_lebanese_scenario_live_20261107.py
          if($LASTEXITCODE -ne 0){throw 'Scenario deployment patch syntax failed'}
          & node tools/test_console_ajax_ui.cjs
          if($LASTEXITCODE -ne 0){throw 'Agent Studio JS regression failed'}
          Write-Output 'SCENARIO_LOCAL_REGRESSION_PASS'
      - name: Publish just the two Agent Studio files by authorized SSH
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $key = Join-Path $env:USERPROFILE '.ssh\ontrack_publish_ed25519'
          if (-not (Test-Path $key)) { throw 'The existing authorized deploy key is unavailable on this runner' }
          $remote = 'appontrack@65.21.208.232'
          $stage = '/home/appontrack/.voice-scenario-' + $env:GITHUB_RUN_ID
          $sshOpt = @('-o','BatchMode=yes','-o','IdentitiesOnly=yes','-o','StrictHostKeyChecking=yes','-o','ConnectTimeout=10')
          & ssh.exe -i $key -p 7195 @sshOpt $remote "mkdir -m 700 '$stage'"
          & scp.exe -i $key -P 7195 @sshOpt tools/patch_lebanese_scenario_live_20261107.py "${remote}:${stage}/patch.py"
          & scp.exe -i $key -P 7195 @sshOpt saas/console/assets/js/app.js "${remote}:${stage}/source-app.js"
          & scp.exe -i $key -P 7195 @sshOpt saas/console/_core/Views.php "${remote}:${stage}/source-Views.php"
          & ssh.exe -i $key -p 7195 @sshOpt $remote "python3 '$stage/patch.py' prepare '$stage'"
          & ssh.exe -i $key -p 7195 @sshOpt $remote "/opt/cpanel/ea-php83/root/usr/bin/php -l '$stage/candidate-Views.php'"
          $js = Join-Path $env:RUNNER_TEMP 'lebanese-scenario-live-candidate.js'
          & scp.exe -i $key -P 7195 @sshOpt "${remote}:${stage}/candidate-app.js" $js
          & node --check $js
          & ssh.exe -i $key -p 7195 @sshOpt $remote "python3 '$stage/patch.py' apply '$stage'"
          & ssh.exe -i $key -p 7195 @sshOpt $remote "python3 '$stage/patch.py' verify '$stage'"
          $url = 'https://app.ontrackegy.com/assets/js/app.js?scenario=' + $env:GITHUB_RUN_ID
          $response = Invoke-WebRequest -Uri $url -TimeoutSec 30 -UseBasicParsing
          if ($response.StatusCode -ne 200 -or $response.Content -notmatch 'lebanese-feedback') {
            throw 'Host hashes verified but public JS was not confirmed; investigate HTTP/CDN state'
          }
          Write-Output 'PUBLIC_JS_PRESET_VERIFIED'
          $receipt = @{
            status = 'VERIFIED'
            run_id = $env:GITHUB_RUN_ID
            commit = $env:GITHUB_SHA
            timestamp_utc = (Get-Date).ToUniversalTime().ToString('o')
            checks = @('php_lint','node_syntax','canonical_root_hash','public_js_http_200')
          } | ConvertTo-Json -Compress
          $filePath = 'docs/ops/LIVE_LEBANESE_FEEDBACK_PROOF_20261107.json'
          $uri = 'https://api.github.com/repos/' + $env:GITHUB_REPOSITORY + '/contents/' + $filePath
          $headers = @{ Authorization = 'Bearer ' + $env:GITHUB_TOKEN; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' }
          $existing = $null
          try { $existing = Invoke-RestMethod -Method Get -Uri $uri -Headers $headers -ErrorAction Stop }
          catch { if ($_.Exception.Response.StatusCode -ne 404) { throw } }
          $payload = @{
            message = 'proof: Lebanese voice scenario deployed to canonical root'
            branch = $env:GITHUB_REF_NAME
            content = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($receipt))
          }
          if ($existing -and $existing.sha) { $payload.sha = $existing.sha }
          $null = Invoke-RestMethod -Method Put -Uri $uri -Headers $headers -Body ($payload | ConvertTo-Json) -ContentType 'application/json'
          Write-Output 'GITHUB_DEPLOY_RECEIPT_WRITTEN'
