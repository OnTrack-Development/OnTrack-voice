name: SaaS 21 fixes regression (NO DEPLOY / NO ANDROID)
on:
  push:
    branches: [fix/saas-21-closure-20261110]
  pull_request:
    branches: [fix/saas-21-closure-20261110]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  php-security-and-core:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite,mbstring,pdo_mysql,curl,openssl,fileinfo,zip,dom,sodium
          coverage: none
      - name: PHP security and surface lint
        run: |
          set -euo pipefail
          find api saas/console/_core -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/tmp/saas-php-lint.txt
          php -l omnira_api_tester.php
          php tools/test_saas_diag_security.php
          php tools/test_saas_security_guards.php
          php tools/test_live_demo_security.php
          php tools/test_auth_login_throttle.php
          php tools/test_saas_quick_answer_policy.php
          php tools/test_saas_phase2_contract_probe.php
          php tools/test_saas_phase2_flow_safety.php
          php tools/test_saas_phase2_knowledge_safety.php
          php tools/test_saas_phase2_billing_current_subscription.php
          php tools/test_saas_phase3_reseller_plan_controls.php
          php tools/test_verified_checkout_settlement.php
          php tools/test_saas_refund_review_render.php
          php tools/test_voice_tool_gateway.php
          php tools/test_voice_flow_runtime.php
          php tools/test_human_escalation.php
          php tools/test_tenant_device_pairing.php
          php tools/test_sim_agent_call_reports.php
          php tools/test_voice_dnc_ledger.php
          php tools/test_console_pricing_ui.php
          php tools/test_verified_signup.php
          php tools/test_white_label_portal.php
          php tools/test_voice_openapi.php
          php tools/test_whatsapp_whmcs_bridge.php
          python3 tools/test_host_link_signed_jobs.py
      - name: JavaScript source syntax
        run: |
          set -euo pipefail
          node --check assets/app.js
          node --check saas/console/assets/js/app.js
          node --check saas/console/assets/js/flow-graph.js
          node tools/test_console_ajax_ui.cjs
          node tools/test_graph_routing.cjs
      - name: Guard native, OTA and deploy source
        run: |
          set -euo pipefail
          git diff --check HEAD~1 HEAD
          if git diff --name-only HEAD~1 HEAD | grep -E '^(VS/|android/|app/src/|saas/mobile/android/|saas/mobile/ota/|saas/mobile/server/|\.github/workflows/.*publish)'; then
            echo 'Forbidden native/deploy changes in SaaS-only branch'
            exit 1
          fi
          echo SAAS_21_CODE_GUARD_PASS
