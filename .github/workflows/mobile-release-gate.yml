name: Native OTA host acknowledgement gate
on:
  pull_request:
    paths:
      - 'tools/queue_mobile_native.py'
      - 'tools/test_mobile_release_gate.py'
      - 'tools/test_native_039_contract.py'
      - 'tools/prepare_mobile_native.py'
      - 'tools/queue_mobile_ota.py'
      - 'saas/mobile/ota/native_deploy.py'
      - 'saas/mobile/ota/native_release.json'
      - 'saas/mobile/ota/release.json'
      - 'saas/mobile/ota/ui.html'
      - 'saas/mobile/audio-proof/prepare.py'
      - '.github/workflows/android-audio-proof.yml'
      - '.github/workflows/mobile-release-gate.yml'
  push:
    branches: [main]
    paths:
      - 'tools/queue_mobile_native.py'
      - 'tools/test_mobile_release_gate.py'
      - 'tools/test_native_039_contract.py'
      - 'tools/prepare_mobile_native.py'
      - 'tools/queue_mobile_ota.py'
      - 'saas/mobile/ota/native_deploy.py'
      - 'saas/mobile/ota/native_release.json'
      - 'saas/mobile/ota/release.json'
      - 'saas/mobile/ota/ui.html'
      - 'saas/mobile/audio-proof/prepare.py'
      - '.github/workflows/android-audio-proof.yml'
      - '.github/workflows/mobile-release-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax and release receipt regression
        run: |
          set -euo pipefail
          python3 -m py_compile tools/queue_mobile_native.py tools/test_mobile_release_gate.py
          python3 tools/test_mobile_release_gate.py
          python3 tools/test_native_039_contract.py
      - name: Release trigger isolation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/android-audio-proof.yml').read_text()
          assert "      - 'tools/queue_mobile_native.py'" not in workflow
          assert "      - 'saas/mobile/server/**'" not in workflow
          manual_only = "on:\n  workflow_dispatch:\n" in workflow and "  push:" not in workflow
          native_paths = "      - 'saas/mobile/audio-proof/**'" in workflow
          assert manual_only or native_paths, "Native source must be tested or legacy publisher quarantined"
          assert "  publish_ota:" not in workflow and "  publish_native:" not in workflow, "Legacy publisher must not publish stale SHA"
          print("Native release safety isolation PASS")
          PY
