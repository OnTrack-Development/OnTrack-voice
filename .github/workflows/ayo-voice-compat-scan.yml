name: AYO voice profiles compatibility scan
on:
  push:
    branches: ['voice-lab/ayo-habibi-compat-20261104']
    paths: ['.github/workflows/ayo-voice-compat-scan.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    name: Analyze local AYO voice profiles
    runs-on: [self-hosted, Windows]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read model container and manifest metadata
        shell: pwsh
        run: ./tools/voice_lab/inspect_ayo_voices.ps1
      - name: Upload metadata (not voice files)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ayo-voice-compatibility-report
          path: ${{ runner.temp }}/ayo-voice-inspect/
          retention-days: 5
          if-no-files-found: ignore
