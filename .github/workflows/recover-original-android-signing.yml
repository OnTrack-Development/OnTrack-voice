# One-time owner-only recovery on the owner's Windows 11 machine.
# No GitHub-hosted runner, APK publication, or artifact upload.
name: Recover original Android signing key (local Windows only)
run-name: Owner-only signing recovery
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ontrack-owner-key-recovery
  cancel-in-progress: false

jobs:
  recover:
    if: github.actor == 'ahmedbedir'
    runs-on: [self-hosted, Windows, X64, ontrack-signing-recovery]
    timeout-minutes: 10
    steps:
      - name: Confirm local GNU tar and zstd support
        shell: powershell
        run: |
          $gnuTar = "C:\Program Files\Git\usr\bin"
          if (-not (Test-Path (Join-Path $gnuTar 'tar.exe'))) {
            throw "GNU tar missing. Install Git for Windows and retry."
          }
          $gnuTar | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          if (-not (Get-Command zstd.exe -ErrorAction SilentlyContinue)) {
            $gitZstd = Join-Path $gnuTar 'zstd.exe'
            if (-not (Test-Path $gitZstd)) {
              throw "zstd missing. Install zstd for Windows, place it on PATH, and retry."
            }
          }
      - name: Restore original signing identity from existing GitHub Actions cache
        id: restored
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: ontrack-voiceproof-debug-signing-v1
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - name: Locate restored archive entry and verify original certificate locally
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # The cache was created on Linux with an absolute home path.
          # A Windows cross-OS extraction may not land under $env:USERPROFILE.
          $roots = @(
            $env:GITHUB_WORKSPACE,
            $env:RUNNER_WORKSPACE,
            $env:RUNNER_TEMP,
            (Join-Path $env:USERPROFILE '.android'),
            'C:\home\runner\.android',
            'D:\home\runner\.android',
            'C:\Program Files\Git\home\runner\.android'
          ) | Where-Object { $_ -and (Test-Path -LiteralPath $_) } | Select-Object -Unique
          $found = @()
          foreach ($root in $roots) {
            $found += @(Get-ChildItem -LiteralPath $root -File -Filter 'debug.keystore' -Recurse -Force -ErrorAction SilentlyContinue)
          }
          $found = @($found | Sort-Object FullName -Unique)
          if ($found.Count -eq 0) {
            throw 'Cache restored, but Linux path did not map to a searchable Windows keystore path. Use local file search before retrying.'
          }
          $expected = 'd25378b9c6d8486749fa64cf1f85a8a2d0b24a599588611392135f54c720ba3f'
          $cert = Join-Path $env:RUNNER_TEMP 'ontrack-android-signing-cert.der'
          $valid = $null
          try {
            foreach ($file in $found) {
              Remove-Item -LiteralPath $cert -Force -ErrorAction SilentlyContinue
              & keytool -exportcert -alias androiddebugkey -keystore $file.FullName -storepass android -file $cert 2>$null | Out-Null
              if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $cert)) { continue }
              $actual = (Get-FileHash -LiteralPath $cert -Algorithm SHA256).Hash.ToLowerInvariant()
              if ($actual -eq $expected) { $valid = $file.FullName; break }
            }
          } finally {
            Remove-Item -LiteralPath $cert -Force -ErrorAction SilentlyContinue
          }
          if (-not $valid) {
            throw 'No restored candidate has the required original signing certificate. Do not use a newly generated key.'
          }
          $dest = Join-Path $env:USERPROFILE '.android\debug.keystore'
          if ($valid -ne $dest) {
            if (Test-Path -LiteralPath $dest) {
              throw 'A keystore already exists at the destination. Refusing to overwrite it.'
            }
            New-Item -ItemType Directory -Path (Split-Path $dest -Parent) -Force | Out-Null
            Copy-Item -LiteralPath $valid -Destination $dest -ErrorAction Stop
          }
          Write-Host 'SIGNING_IDENTITY_VERIFIED: PASS'
          Write-Host ('Verified Android signing key exists locally at: ' + $dest)
          Write-Host 'Never commit, upload, or share the private keystore.'
